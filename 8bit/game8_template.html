<!DOCTYPE html>

<head>

<title>ASTRO DASH 8-BIT - NES Style Platformer</title>
<meta name="description" content="ASTRO DASH 8-BIT: a free browser platformer rendered at real NES resolution (256x240). Three deep space sectors, one blue astronaut robot. No install, works offline." />
<meta property="og:type" content="website" />
<meta property="og:title" content="ASTRO DASH 8-BIT - NES Style Platformer" />
<meta property="og:description" content="A free browser platformer at true NES resolution (256x240). Three deep space sectors, one blue astronaut robot." />

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:#9fb4ff}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  /* 256x240 logical pixels, NES aspect, hard pixel upscale */
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    width:min(100vw, 106.667vh); height:auto;background:#000;
    box-shadow:0 0 40px rgba(60,120,255,.25)}
  #crt{position:fixed;inset:0;pointer-events:none;display:none;z-index:5;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,.30) 0 1px, rgba(0,0,0,0) 1px 3px),
               radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%)}
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;
    padding:8px 12px 14px;pointer-events:none;z-index:10}
  #touch .side{display:flex;gap:10px;pointer-events:auto}
  .btn{width:62px;height:62px;border:0;border-radius:4px;background:#1b1b3a;color:#a4e4fc;
    font-family:inherit;font-size:20px;display:flex;align-items:center;justify-content:center;
    border-bottom:4px solid #0a0a1e;user-select:none;-webkit-user-select:none}
  .btn:active{background:#3cbcfc;color:#101034}
  .btn.jump{width:76px;height:76px;background:#3a1b1b;color:#fce0a8;border-bottom-color:#1a0808}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="256" height="240"></canvas></div>
<div id="crt"></div>
<div id="touch">

  <div class="side"><button class="btn jump" data-k="jump">&#9650;</button></div>

<script>

   ===================================================================== */

            B:'#0058f8', b:'#0000bc', c:'#3cbcfc', s:'#a4e4fc', n:'#000050',
            h:'#d8f8ff', r:'#d82800', o:'#f87858', Y:'#f8b800', y:'#fce0a8',

function textWidth(s, sc){ sc = sc || 1; return s.length * 6 * sc - sc; }
window.__textOverflow = [];
function drawText(g, s, x, y, col, sc){
  sc = sc || 1; g.fillStyle = col || C.w;
  if((x < 0 || x + textWidth(s, sc) > W) && window.__textOverflow.indexOf(s) < 0) window.__textOverflow.push(s);
  s = String(s).toUpperCase();
  for(let i=0; i<s.length; i++){
    const glyph = FONT[s[i]];
    if(glyph){
      const rows = glyph.split('/');
      for(let r=0; r<7; r++){
        for(let c2=0; c2<5; c2++){
          if(rows[r][c2] === '1') g.fillRect(x + i*6*sc + c2*sc, y + r*sc, sc, sc);
        }
      }
    }
  }
}
function textCenter(g, s, y, col, sc){ drawText(g, s, Math.round((W - textWidth(s, sc)) / 2), y, col, sc); }

/* ------------------------------ sprites ------------------------------ */
window.__artErrors = [];
function mkSprite(rows){
  const h = rows.length, w = rows[0].length;
  rows.forEach((r, i)=>{ if(r.length !== w) window.__artErrors.push('row ' + i + ' len ' + r.length + ' != ' + w + ' :: ' + r); });
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  for(let y=0; y<h; y++) for(let x=0; x<w; x++){
    const ch = rows[y][x];
    if(ch === '.' || ch === ' ') continue;
    if(!C[ch] && window.__artErrors.indexOf('unknown colour ' + ch) < 0) window.__artErrors.push('unknown colour ' + ch);
    g.fillStyle = C[ch] || '#f0f';
    g.fillRect(x, y, 1, 1);
  }
  return cv;
}
function flipSprite(src){
  const cv = document.createElement('canvas'); cv.width = src.width; cv.height = src.height;
  const g = cv.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return cv;
}

          '.ngccccccccggn..','.ngggggggggggn..','..nnnnnnnnnnnn..','...c........c...','..cc........cc..'],
  orb1  :['..nnnn..','.nccccn.','nccwwwhc','ncwwwwsc','ncwwwwsc','nccwwwhc','.nccccn.','..nnnn..'],
  orb2  :['........','..nnn...','.ncwwn..','.ncwwn..','.ncwwn..','.ncwwn..','..nnn...','........'],

/* portal: 16x32 animated ring, 3 frames */
function mkPortal(frame){
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 32;
  const g = cv.getContext('2d');
  const pal = [C.p, C.P, C.c];
  for(let i=0;i<6;i++){
    const inset = Math.abs(i - 3) + frame;
    if(inset > 3) continue;
    g.strokeStyle = pal[(i + frame) % 3];
    g.lineWidth = 1;
    g.strokeRect(1 + inset, 2 + inset*1.4, 13 - inset*2, 28 - inset*2.8);
  }
  g.fillStyle = frame === 1 ? C.w : C.P;
  g.fillRect(6, 14, 4, 5);
  return cv;
}
SPR.portal = [mkPortal(0), mkPortal(1), mkPortal(2)];

/* ------------------------------ tiles ------------------------------ */
const TILE = {};
function tileCanvas(fn){
  const cv = document.createElement('canvas'); cv.width = T; cv.height = T;
  const g = cv.getContext('2d'); fn(g); return cv;
}
function px(g,x,y,w,h,c){ g.fillStyle = c; g.fillRect(x,y,w,h); }
const theme = {
  sky:'#000010',
  hullA:'#101038', hullB:'#282858', hullC:'#3cbcfc',
  rockA:'#503000', rockB:'#7c4c00', rockC:'#fce0a8',
  pop:'#3cbcfc'
};
function buildTiles(th){
  const hullA = ['#101038','#1c1c4c','#282858'][th] || '#101038';
  TILE['#'] = tileCanvas(g=>{
    px(g,0,0,16,16,hullA); px(g,0,0,16,1,'#3a3a7a'); px(g,0,15,16,1,'#08081e');
    px(g,1,1,14,14,'#1c1c4c'); px(g,1,1,14,1,'#4a4a9c');
    px(g,3,3,2,2,'#5a5aa8'); px(g,11,3,2,2,'#5a5aa8');
    px(g,3,11,2,2,'#5a5aa8'); px(g,11,11,2,2,'#5a5aa8');
    px(g,7,7,2,2,'#3cbcfc');
  });
  TILE['R'] = tileCanvas(g=>{
    px(g,0,0,16,16,'#301c10'); px(g,0,0,16,2,'#5a3a1e');
    px(g,0,0,1,16,'#6a4526'); px(g,15,0,1,16,'#241408'); px(g,0,15,16,1,'#241408');
    px(g,3,4,2,2,'#7c4c00'); px(g,10,6,3,2,'#7c4c00'); px(g,6,11,2,2,'#7c4c00');
    px(g,11,12,2,1,'#7c4c00'); px(g,2,9,1,1,'#7c4c00');
  });
  TILE['B'] = tileCanvas(g=>{
    px(g,0,0,16,16,'#282858'); px(g,0,0,16,1,'#6a6ab0'); px(g,0,0,1,16,'#6a6ab0');
    px(g,15,0,1,16,'#0c0c28'); px(g,0,15,16,1,'#0c0c28');
    px(g,3,3,10,10,'#101038');
    px(g,3,3,10,1,'#f8b800'); px(g,3,14,10,1,'#f8b800');
    px(g,3,3,1,10,'#f8b800'); px(g,12,3,1,10,'#f8b800');
    px(g,5,5,2,2,'#f8b800'); px(g,9,9,2,2,'#f8b800');
  });
  TILE['-'] = tileCanvas(g=>{
    px(g,0,3,16,10,'#08081e');
    px(g,0,4,16,2,'#a4e4fc'); px(g,0,7,16,3,'#3cbcfc'); px(g,0,10,16,2,'#0058f8');
    px(g,0,12,16,1,'#08081e');
  });
  TILE['^'] = tileCanvas(g=>{
    px(g,0,10,16,6,'#3a1010'); px(g,0,10,16,1,'#7c2828');
    for(let i=0;i<3;i++){
      const bx = 1 + i*5;
      for(let r=0;r<8;r++){
        px(g,bx + r*0.6, 12 + r, 4 - r*0.5, 1, r < 4 ? '#f87858' : '#f8b800');

  TILE['?'] = tileCanvas(g=>{

buildTiles(0);

/* ------------------------------ audio ------------------------------ */
let ac = null, muted = false, musicOn = true;
const NOTE = {};
(function(){
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  for(let oct=1; oct<=6; oct++){
    for(let i=0;i<12;i++){
      const f = 16.3516 * Math.pow(2, oct + i/12);
      NOTE[names[i].replace('#','s') + oct] = f;
    }
  }
})();
function unlockAudio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac = null; } }
  if(ac && ac.state === 'suspended') ac.resume();
}
let noiseBuf = null;
function noise(){
  if(!noiseBuf && ac){
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.3, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
  }
  return noiseBuf;
}
function tone(freq, dur, type, vol, slideTo, at){
  if(muted || !ac) return;
  const t0 = at || ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(25, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol === undefined ? 0.05 : vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function hit(dur, vol, at, hz){
  if(muted || !ac) return;
  const t0 = at || ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise();
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = hz || 1800;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol || 0.06, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start(t0); s.stop(t0 + dur + 0.02);
}
function arp(notes, step, dur, type, vol){
  unlockAudio(); if(!ac) return;
  notes.forEach((n, i)=> tone(NOTE[n] || 440, dur, type || 'square', vol || 0.045, null, ac.currentTime + i*step));
}
const sfx = {
  jump(){ arp(['E5','A5'], 0.045, 0.09, 'square', 0.04); },
  coin(){ arp(['B5','E6'], 0.07, 0.06, 'square', 0.045); },
  stomp(){ unlockAudio(); if(!ac) return; hit(0.09, 0.08, null, 900); tone(160, 0.09, 'square', 0.04, 70); },
  bump(){ tone(140, 0.06, 'square', 0.035); },
  hurt(){ arp(['G4','E4','C4'], 0.07, 0.14, 'square', 0.05); },
  clear(){ arp(['C5','E5','G5','C6','G5','C6'], 0.11, 0.16, 'square', 0.045); },
  over(){ arp(['C5','G4','E4','C4','G3'], 0.16, 0.22, 'triangle', 0.05); },
  portal(){ arp(['C5','D5','E5','G5','C6'], 0.08, 0.12, 'triangle', 0.045); }
};

/* --- chiptune: 2 pulse channels + triangle bass + noise percussion --- */
const SONG = {
  bpm: 138,
  lead: ['E5','-','A5','-','C6','-','A5','-','G5','-','E5','-','D5','-','E5','-',
         'F5','-','A5','-','D6','-','A5','-','G5','-','E5','-','C5','-','D5','-',
         'E5','-','A5','-','C6','-','E6','-','D6','-','A5','-','G5','-','E5','-',
         'F5','-','E5','-','D5','-','C5','-','D5','-','E5','-','A4','-','-','-'],
  bass:['A2','-','A2','-','A2','-','A2','-','E2','-','E2','-','E2','-','E2','-',
        'F2','-','F2','-','D2','-','D2','-','G2','-','G2','-','C2','-','C2','-',
        'A2','-','A2','-','A2','-','A2','-','F2','-','F2','-','F2','-','F2','-',
        'G2','-','G2','-','C3','-','C3','-','E2','-','E2','-','A2','-','-','-'],
  drum:['k','-','h','-','s','-','h','-','k','-','h','-','s','-','h','h',
        'k','-','h','-','s','-','h','-','k','-','h','-','s','-','h','h',
        'k','-','h','-','s','-','h','-','k','-','h','-','s','-','h','h',
        'k','-','h','-','s','-','h','-','k','h','k','h','s','-','h','h']
};
let musStep = 0, musNext = 0, musTimer = null;
function playStep(i, at){
  const lead = SONG.lead[i % SONG.lead.length];
  const bass = SONG.bass[i % SONG.bass.length];
  const dr = SONG.drum[i % SONG.drum.length];
  if(lead !== '-') tone(NOTE[lead] || 440, 0.14, 'square', 0.028, null, at);
  if(bass !== '-') tone(NOTE[bass] || 110, 0.18, 'triangle', 0.05, null, at);
  if(dr === 'k') hit(0.07, 0.07, at, 320);
  else if(dr === 'h') hit(0.03, 0.025, at, 6000);
  else if(dr === 's') hit(0.08, 0.045, at, 1400);
}
function startMusic(){
  unlockAudio(); if(!ac || musTimer || muted || !musicOn) return;
  musNext = ac.currentTime + 0.08;
  musTimer = setInterval(()=>{
    if(!ac || muted){ return; }
    while(musNext < ac.currentTime + 0.25){
      playStep(musStep, musNext);
      musNext += 60 / SONG.bpm / 4;
      musStep++;
    }
  }, 45);
}
function stopMusic(){ if(musTimer){ clearInterval(musTimer); musTimer = null; } }

/* ------------------------------ levels ------------------------------ */
function isSolid(ch){ return ch === '#' || ch === 'R' || ch === 'B' || ch === '?'; }
function isOneWay(ch){ return ch === '-'; }
let level = null, player = null, enemies = [], orbs = [], parts = [], pops = [];
let camera = { x:0, y:0 }, shake = 0, flash = 0;
const game = { state:ST.TITLE, levelIndex:0, score:0, hearts:3, t:0, timer:0, lastAdv:-999,
               card:'', cardSub:'', best:0 };
const keys = { left:false, right:false, jump:false, sprint:false };
let jumpEdge = false;

function tileCh(cx, cy){
  if(cy < 0 || cy >= level.h) return ' ';
  if(cx < 0 || cx >= level.w) return '#';
  return level.tiles[cy][cx];
}
function solidAt(pxp, pyp){ return isSolid(tileCh(Math.floor(pxp/T), Math.floor(pyp/T))); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function mkWalker(x,y){ return { t:'walker', x:x+2, y:y+3, w:12, h:13, vx:-0.48, vy:0, alive:true, a:Math.random()*6.28, base:y+3 }; }
function mkDrone(x,y){ return { t:'drone', x:x+1, y:y+1, w:14, h:12, vx:-0.6, vy:0, alive:true, a:Math.random()*6.28, base:y+1, range:48, ox:x }; }

function loadLevel(i){
  const def = LEVELS[i];
  const w = def.width, h = def.rows.length;
  level = { def, w, h, tiles: def.rows.map(r=>r.split('')), theme:def.theme, name:def.name, sub:def.sub };
  buildTiles(def.theme);                              // per-theme tile colours
  enemies = []; orbs = []; parts = []; pops = [];
  let spawn = { x: 3*T, y: 12*T };
  for(let y=0; y<h; y++) for(let x=0; x<w; x++){
    const ch = level.tiles[y][x];
    if(ch === 'P'){ spawn = { x: x*T+2, y: y*T+2 }; level.tiles[y][x] = ' '; }
    else if(ch === 'e'){ enemies.push(mkWalker(x*T, y*T)); level.tiles[y][x] = ' '; }
    else if(ch === 'f'){ enemies.push(mkDrone(x*T, y*T)); level.tiles[y][x] = ' '; }
    else if(ch === 'o'){ orbs.push({ x: x*T+8, y: y*T+8, taken:false, a:Math.random()*6.28 }); level.tiles[y][x] = ' '; }
    else if(ch === 'G'){ level.goal = { x: x*T, y: y*T, taken:false }; level.tiles[y][x] = ' '; }
  }
  if(!level.goal) level.goal = { x:(w-6)*T, y:13*T };
  player = { x:spawn.x, y:spawn.y, w:13, h:19, vx:0, vy:0, onGround:false, face:1,
             anim:0, inv:0, coyote:0, buf:0, safe:{x:spawn.x, y:spawn.y} };
  camera.x = clamp(player.x + player.w/2 - W/2, 0, Math.max(0, w*T - W));
  camera.y = 0;
  game.timer = 0; game.msg = '';
}
function burst(x,y,n,col,spd){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, s = (spd||1.6)*(0.35+Math.random());
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 0.5, life:1, col, r: Math.random()<0.5?1:2 });
  }
}
function popup(x,y,text,col){ pops.push({ x, y, text, col: col || C.y, life:1 }); }

function moveX(e){
  e.x += e.vx; e.hitWall = 0;
  const ys = [e.y+2, e.y+e.h/2, e.y+e.h-2];
  if(e.vx > 0){
    const cx = Math.floor((e.x+e.w)/T);
    if(ys.some(py=>isSolid(tileCh(cx, Math.floor(py/T))))){ e.x = cx*T - e.w - 0.01; e.vx = 0; e.hitWall = 1; }
  } else if(e.vx < 0){
    const cx = Math.floor(e.x/T);
    if(ys.some(py=>isSolid(tileCh(cx, Math.floor(py/T))))){ e.x = (cx+1)*T + 0.01; e.vx = 0; e.hitWall = -1; }
  }
}
function moveY(e){
  const prevBottom = e.y + e.h;
  e.y += e.vy; e.onGround = false;
  const xs = [e.x+2, e.x+e.w/2, e.x+e.w-2];
  if(e.vy > 0){
    const cy = Math.floor((e.y+e.h)/T);
    for(const pxp of xs){
      const cx = Math.floor(pxp/T), ch = tileCh(cx, cy);
      if(isSolid(ch) || (isOneWay(ch) && prevBottom <= cy*T + 2)){
        e.y = cy*T - e.h - 0.01; e.vy = 0; e.onGround = true; break;
      }
    }
  } else if(e.vy < 0){
    const cy = Math.floor(e.y/T);
    for(const pxp of xs){
      const cx = Math.floor(pxp/T), ch = tileCh(cx, cy);
      if(isSolid(ch)){ e.y = (cy+1)*T + 0.01; e.vy = 0; e.headHit = {cx, cy}; break; }
    }
  }
}

/* ------------------------------ flow ------------------------------ */
function startGame(){ game.score = 0; game.hearts = 3; game.levelIndex = 0; game.best = 0; game.submitted = false; game.rank = 0; toCard(); }
function toCard(){
  loadLevel(game.levelIndex);
  game.card = 'SECTOR ' + (game.levelIndex+1) + '-1';
  game.cardSub = level.name;
  game.state = ST.CARD; game.timer = 0; stopMusic();
}
function beginPlay(){ game.state = ST.PLAY; startMusic(); }
function togglePause(){
  if(game.state === ST.PLAY){ game.state = ST.PAUSE; stopMusic(); }
  else if(game.state === ST.PAUSE){ game.state = ST.PLAY; startMusic(); }
}
function advance(){
  if(game.t - game.lastAdv < 25) return;
  game.lastAdv = game.t;
  if(game.state === ST.CARD) beginPlay();
  else if(game.state === ST.CLEAR){
    game.levelIndex++;
    if(game.levelIndex >= LEVELS.length){ game.state = ST.WIN; game.best = game.score; stopMusic(); sfx.clear(); finishRun(); }
    else toCard();
  } else if(game.state === ST.DEAD){
    if(game.hearts > 0) respawnAtCheckpoint(); else { game.state = ST.OVER; stopMusic(); finishRun(); }
  } else if(game.state === ST.OVER || game.state === ST.WIN){
    game.state = ST.TITLE; stopMusic();
  }
}
function hurt(fromX){
  if(player.inv > 0 || game.state !== ST.PLAY) return;
  game.hearts--; player.inv = 110; shake = 5; flash = 6; sfx.hurt();
  const dir = (fromX === undefined) ? -player.face : (player.x + player.w/2 < fromX ? -1 : 1);
  player.vx = dir * 2.8; player.vy = -3.6; player.onGround = false; player.buf = 0;
  burst(player.x+player.w/2, player.y+player.h/2, 10, C.o, 2);
  if(game.hearts <= 0){ game.state = ST.DEAD; game.timer = 0; stopMusic(); setTimeout(()=>sfx.over(), 260); }
}
function killPlayer(){
  if(game.state !== ST.PLAY) return;
  game.hearts--; shake = 8; flash = 8; sfx.hurt();
  burst(player.x+player.w/2, player.y+player.h/2, 14, C.c, 2.4);
  game.state = ST.DEAD; game.timer = 0; stopMusic();
  if(game.hearts <= 0) setTimeout(()=>sfx.over(), 300);
}
function respawnAtCheckpoint(){
  const s = player.safe || {x:player.x, y:player.y};
  player.x = s.x; player.y = s.y - 1; player.vx = 0; player.vy = 0; player.inv = 110;
  camera.x = clamp(player.x + player.w/2 - W/2, 0, Math.max(0, level.w*T - W));
  burst(player.x+player.w/2, player.y+player.h/2, 12, C.s, 2);
  game.state = ST.PLAY; startMusic();
}

/* ------------------------------ step ------------------------------ */
function step(){
  game.t++;
  if(game.state === ST.CARD){ game.timer++; if(game.timer > 100) beginPlay(); }
  else if(game.state === ST.PLAY) updatePlay();
  else if(game.state === ST.CLEAR){ game.timer++; if(game.timer > 200) advance(); }
  else if(game.state === ST.DEAD){ game.timer++; if(game.timer > 130) advance(); }
  if(shake > 0) shake *= 0.88;
  if(flash > 0) flash--;
  for(const p of parts){ p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.99; p.life -= 0.03; }
  parts = parts.filter(p=>p.life > 0);
  for(const p of pops){ p.y -= 0.4; p.life -= 0.022; }
  pops = pops.filter(p=>p.life > 0);
  if(level){
    const tx = clamp(player.x + player.w/2 - W/2, 0, Math.max(0, level.w*T - W));
    camera.x += (Math.round(tx) - camera.x) * 0.18;
  }
}
function updatePlay(){
  const p = player;
  const maxSpd = keys.sprint ? PHYS.MAXSPRINT : PHYS.MAXRUN;
  if(keys.left && !keys.right){ p.vx -= PHYS.ACC; p.face = -1; }
  else if(keys.right && !keys.left){ p.vx += PHYS.ACC; p.face = 1; }
  else { p.vx *= p.onGround ? PHYS.FRIC : PHYS.AIR; if(Math.abs(p.vx) < 0.03) p.vx = 0; }
  p.vx = clamp(p.vx, -maxSpd, maxSpd);

  if(jumpEdge){ p.buf = PHYS.BUFFER; jumpEdge = false; }
  if(p.buf > 0) p.buf--;
  if(p.onGround) p.coyote = PHYS.COYOTE; else if(p.coyote > 0) p.coyote--;
  if(p.buf > 0 && p.coyote > 0){
    p.vy = PHYS.JUMP; p.onGround = false; p.coyote = 0; p.buf = 0; sfx.jump();
    burst(p.x+p.w/2, p.y+p.h, 4, C.s, 1.1);
  }
  if(!keys.jump && p.vy < -5.35) p.vy = -5.35;   // min hop ~3.4 tiles, held jump ~4.3 tiles
  p.vy = Math.min(p.vy + PHYS.G, PHYS.MAXFALL);
  moveX(p); moveY(p);
  if(p.headHit){
    const {cx, cy} = p.headHit;
    if(tileCh(cx,cy) === '?'){
      level.tiles[cy][cx] = 'u';
      orbs.push({ x: cx*T+8, y: cy*T-6, taken:false, a:0, vy:-3, bounce:true });
      game.score += 5; sfx.bump(); burst(cx*T+8, cy*T+8, 6, C.Y, 1.4);
    } else sfx.bump();
    p.headHit = null;
  }
  if(p.onGround){
    const below = tileCh(Math.floor((p.x+p.w/2)/T), Math.floor((p.y+p.h+2)/T));
    if(below === '#' || below === 'R') p.safe = { x:p.x, y:p.y };
  }
  p.anim += Math.abs(p.vx) * 0.3;

  for(const o of orbs){
    if(o.bounce){ o.vy += 0.17; o.y += o.vy; }
    else if(!o.taken) o.y += Math.sin(game.t*0.06 + o.a) * 0.12;
    if(o.taken) continue;
    const box = { x:o.x-7, y:o.y-7, w:14, h:14 };
    if(overlap(p, box)){
      o.taken = true; game.score += 10; sfx.coin();
      burst(o.x, o.y, 6, C.c, 1.6); popup(o.x, o.y-8, '10');
    }
  }
  orbs = orbs.filter(o=>!o.taken && o.y < level.h*T + 120);

  for(const e of enemies){
    if(!e.alive || Math.abs(e.x - p.x) > 900) continue;
    if(e.t === 'walker'){
      e.a += 0.12;
      e.vy = Math.min(e.vy + PHYS.G, PHYS.MAXFALL);
      const aheadX = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
      const belowSolid = solidAt(aheadX, e.y + e.h + 3) || isOneWay(tileCh(Math.floor(aheadX/T), Math.floor((e.y+e.h+3)/T)));
      if(!belowSolid) e.vx = -e.vx;
      moveX(e);
      if(e.hitWall) e.vx = -e.hitWall * 0.95;
      moveY(e);
    } else {
      e.a += 0.08;
      e.x += e.vx;
      if(Math.abs(e.x - e.ox) > e.range) e.vx = -e.vx;
      e.y = e.base + Math.sin(e.a) * 13;
    }
    if(overlap(p, e)){
      const feet = p.y + p.h;
      if(p.vy > 0.25 && feet - e.y < 10){
        e.alive = false; game.score += 25; sfx.stomp(); shake = 3;
        p.vy = keys.jump ? -6.3 : -4.8;
        burst(e.x+e.w/2, e.y+e.h/2, 8, e.t === 'walker' ? C.e : C.P, 1.8);
        popup(e.x+e.w/2, e.y, '25');
      } else hurt(e.x + e.w/2);
    }
  }

  const feetRow = Math.floor((p.y + p.h - 2)/T);
  for(let i=0;i<3;i++){
    const pxp = p.x + 2 + i*(p.w-4)/2;
    if(tileCh(Math.floor(pxp/T), feetRow) === '^'){ hurt(); break; }
  }

  if(level.goal && !level.goal.taken){
    const gb = { x: level.goal.x, y: level.goal.y - 36, w:16, h:68 };
    if(overlap(p, gb)){
      level.goal.taken = true; game.score += 200; sfx.clear(); sfx.portal();
      burst(gb.x+8, gb.y+34, 26, C.P, 2.6);
      game.state = ST.CLEAR; game.timer = 0; stopMusic();
    }
  }
  if(p.y > level.h*T + 40) killPlayer();
  if(p.inv > 0) p.inv--;
}

/* ------------------------------ render ------------------------------ */
const themes = [
  { sky:'#000010', star:'#fcfcfc', star2:'#3cbcfc', planet:'#0058f8', planet2:'#3cbcfc', far:'#101038' },
  { sky:'#100008', star:'#fce0a8', star2:'#f87858', planet:'#7c4c00', planet2:'#f8b800', far:'#301c10' },
  { sky:'#0c0018', star:'#d882f8', star2:'#58d854', planet:'#500060', planet2:'#a800a8', far:'#180030' }
];
let stars = [], planetCv = null;
function initSky(seed){
  stars = [];
  let s = seed * 7919 + 13;
  const rnd = ()=> ((s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  for(let layer=0; layer<2; layer++){
    const n = layer ? 26 : 42;
    for(let i=0;i<n;i++){
      stars.push({ x: Math.floor(rnd()*640), y: Math.floor(rnd()*200) + (layer?20:0),
                   l: layer, c: rnd() < 0.25 ? 1 : 0, p: Math.floor(rnd()*64) });
    }
  }
}
function buildPlanet(th){
  const c = themes[th];
  const cv = document.createElement('canvas'); cv.width = 72; cv.height = 48;
  const g = cv.getContext('2d');
  const r = 22, cx = 36, cy = 24;
  for(let y=-r; y<=r; y++){
    const w2 = Math.floor(Math.sqrt(Math.max(0, r*r - y*y)));
    if(w2 <= 0) continue;
    px(g, cx-w2, cy+y, w2*2, 1, y < -6 ? c.planet2 : c.planet);
    if(y > r*0.35) px(g, cx-w2, cy+y, Math.floor(w2*0.6), 1, 'rgba(0,0,0,0.35)');
  }
  g.strokeStyle = c.planet2; g.lineWidth = 2;
  g.beginPath(); g.ellipse(cx, cy+4, 34, 8, -0.25, 0, 6.283); g.stroke();
  return cv;
}
function drawSky(){
  const th = level ? level.theme : 0, c = themes[th];
  let s = 1234 + th*77;
  const rnd = ()=> ((s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  ctx.fillStyle = c.sky; ctx.fillRect(0, 0, W, H);
  if(!planetCv || planetCv._th !== th){ planetCv = buildPlanet(th); planetCv._th = th; }
  const pxp = Math.round(150 - camera.x*0.08) % 900;
  ctx.drawImage(planetCv, pxp, 26);
  ctx.drawImage(planetCv, pxp + 460, 26);
  const mx = Math.round(60 - camera.x*0.14) % 700;
  px(ctx, mx, 60, 10, 10, c.planet2);
  px(ctx, mx+2, 62, 3, 3, c.planet);
  px(ctx, mx+6, 66, 3, 3, c.planet);
  for(const st of stars){
    const fac = st.l ? 0.5 : 0.25;
    const x = ((st.x - camera.x*fac) % 640 + 640) % 640;
    const tw = ((game.t + st.p) % 96) < 60;
    if(!tw && st.l === 1) continue;
    px(ctx, x, st.y, st.l ? 2 : 1, st.l ? 2 : 1, st.c ? c.star2 : c.star);
  }
  for(let i=0;i<7;i++){
    const x = ((i*180 - camera.x*0.35) % 700 + 700) % 700 - 120;
    if(th === 0) px(ctx, x, 196, 60, 44, c.far);
    else px(ctx, x, 204, 44, 36, c.far);
  }
}
function drawTiles(){
  const x0 = Math.max(0, Math.floor(camera.x/T) - 1);
  const x1 = Math.min(level.w-1, Math.ceil((camera.x + W)/T) + 1);
  const y1 = Math.min(level.h-1, Math.floor(H/T) - 1);
  for(let y=0; y<=y1; y++){
    for(let x=x0; x<=x1; x++){
      const ch = level.tiles[y][x];
      if(ch === ' ') continue;
      let cv2 = TILE[ch];
      if(ch === '-'){                     // animated energy beam
        cv2 = (Math.floor(game.t/16) % 2) ? TILE['-'] : TILE['-'];
      }
      ctx.drawImage(cv2, Math.round(x*T - camera.x), y*T);
    }
  }
}
function heroSprite(){
  const p = player;
  if(!p.onGround) return p.face < 0 ? SPR.heroJumpF : SPR.heroJump;
  if(Math.abs(p.vx) > 0.35) return ((Math.floor(p.anim) % 2) ? (p.face < 0 ? SPR.heroRun2F : SPR.heroRun2)
                                                            : (p.face < 0 ? SPR.heroRun1F : SPR.heroRun1));
  return p.face < 0 ? SPR.heroIdleF : SPR.heroIdle;
}
function drawEntities(){
  for(const o of orbs){
    const x = Math.round(o.x - camera.x), y = Math.round(o.y + Math.sin(game.t*0.08 + o.a)*1.5);
    if(x < -16 || x > W+16) continue;
    ctx.drawImage((Math.floor(game.t/10) % 2) ? SPR.orb1 : SPR.orb2, x-4, y-4);
  }
  for(const e of enemies){
    if(!e.alive) continue;
    const x = Math.round(e.x - camera.x), y = Math.round(e.y);
    if(x < -24 || x > W+24) continue;
    if(e.t === 'walker') ctx.drawImage((Math.floor(game.t/8) % 2) ? SPR.walker1 : SPR.walker2, x, y - 2);
    else ctx.drawImage((Math.floor(game.t/6) % 2) ? SPR.drone1 : SPR.drone2, x, y);
  }
  const gl = level.goal;
  if(gl){
    const x = Math.round(gl.x - camera.x);
    if(x > -32 && x < W+32) ctx.drawImage(SPR.portal[Math.floor(game.t/8) % 3], x, gl.y - 16);
  }
  if(player){
    const p = player, x = Math.round(p.x + p.w/2 - camera.x) - 8, y = Math.round(p.y + p.h - camera.y) - 22;
    if(!(p.inv > 0 && Math.floor(game.t/3) % 2)) ctx.drawImage(heroSprite(), x, y);
  }
  for(const pa of parts){
    ctx.fillStyle = pa.col;
    ctx.fillRect(Math.round(pa.x - camera.x), Math.round(pa.y - camera.y), Math.max(1, pa.r*pa.life), Math.max(1, pa.r*pa.life));
  }
  for(const po of pops){
    drawText(ctx, po.text, Math.round(po.x - camera.x), Math.round(po.y - camera.y), po.col, 1);
  }
}
/* NES-style status bar: 2 rows of pixel text at the very top */
function drawHUD(){
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, 20);
  drawText(ctx, 'ORB ' + String(game.score).padStart(6,'0'), 4, 3, C.w);
  const sec = 'SECTOR ' + (game.levelIndex+1) + '-1';
  drawText(ctx, sec, W - textWidth(sec) - 4, 3, C.e);
  for(let i=0;i<3;i++){
    const img = (i < game.hearts) ? SPR.heart : SPR.heartEmpty;
    ctx.drawImage(img, 4 + i*10, 12);
  }
  drawText(ctx, 'LIVES', W - textWidth('LIVES') - 4, 12, C.g);
}
function panel(x, y, w, h){
  ctx.fillStyle = '#000000'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = C.w; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}
/* ------------------------------ leaderboard ------------------------------ */
const LB_KEY = 'astroDash8.scores.v2';
const LB_PILOT = 'astroDash8.pilot.v2';
const NAME_MAX = 8;
function dedupeScores(list){
  // the same name is the same player: keep only their highest score
  const best = new Map();
  for(const e of list){
    const cur = best.get(e.n);
    if(!cur || e.s > cur.s) best.set(e.n, e);
  }
  return Array.from(best.values()).sort((a, b) => b.s - a.s).slice(0, 10);
}
function loadScores(){
  try{
    const raw = localStorage.getItem(LB_KEY);
    const a = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(a)) return [];
    return dedupeScores(a.filter(e => e && typeof e.s === 'number' && typeof e.n === 'string'));
  }catch(err){ return []; }
}
function saveScores(list){
  try{ localStorage.setItem(LB_KEY, JSON.stringify(list.slice(0, 10))); }catch(err){}
}
try{ localStorage.removeItem('astroDash8.scores.v1'); localStorage.removeItem('astroDash8.pilot.v1'); }catch(err){}   // launch reset: drop pre-release saves
let scores = loadScores();
let pilotName = (()=>{ try{ return (localStorage.getItem(LB_PILOT) || '').slice(0, NAME_MAX); }catch(err){ return ''; } })();
function rememberPilot(n){ try{ localStorage.setItem(LB_PILOT, n); }catch(err){} }
function submitScore(name, score){
  const n = (name || 'PILOT').slice(0, NAME_MAX);
  if(!(score > 0)) return { rank:0, improved:false };
  const prev = scores.find(e => e.n === n);
  const improved = !prev || (score|0) > prev.s;
  scores = dedupeScores(scores.concat([{ n:n, s:score|0, k:(game.levelIndex + 1) }]));
  saveScores(scores);
  const i = scores.findIndex(e => e.n === n);
  return { rank: i >= 0 ? i + 1 : 0, improved: improved };
}
function finishRun(){
  if(game.submitted) return;
  game.submitted = true;
  const r = submitScore(game.name, game.score);
  game.rank = r.rank; game.improved = r.improved;
}
function confirmName(){
  const n = (pilotName || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_MAX);
  game.name = n || 'PILOT';
  rememberPilot(game.name);
  startGame();
}
let kbCells = [];
function kbHit(x, y){
  for(const c of kbCells) if(x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h) return c.k;
  return null;
}
function nameKey(k){
  if(k === 'OK') confirmName();
  else if(k === 'ESC') backToTitle();
  else if(k === 'DEL') pilotName = pilotName.slice(0, -1);
  else if(pilotName.length < NAME_MAX) pilotName += k;
}
function backToTitle(){ game.state = ST.TITLE; }
let scoresFrom = ST.TITLE;
function openScores(from){ scoresFrom = (from === undefined ? game.state : from); game.state = ST.SCORES; }
function closeScores(){ game.state = scoresFrom; }
function drawScores(){
  const c = themes[0];
  ctx.fillStyle = c.sky; ctx.fillRect(0, 0, W, H);
  for(const st of stars){ px(ctx, st.x % W, st.y, 1, 1, st.c ? c.star2 : c.star); }
  textCenter(ctx, 'HIGH SCORES', 22, C.Y, 2);
  if(scores.length === 0){
    textCenter(ctx, 'NO SCORES YET', 108, C.g);
    textCenter(ctx, 'PLAY TO SET ONE', 122, C.g);
  } else {
    for(let i = 0; i < scores.length; i++){
      const e = scores[i];
      const col = i === 0 ? C.Y : (i < 3 ? C.c : C.g);
      const row = String(i + 1).padStart(2, ' ') + '. '
                + String(e.n).slice(0, NAME_MAX).padEnd(NAME_MAX, ' ') + ' '
                + String(e.s).padStart(6, '0');
      textCenter(ctx, row, 52 + i*10, col);
    }
  }
  textCenter(ctx, touchMode ? 'TAP TO GO BACK' : 'BACKSPACE = BACK', 200, C.g);
}
function drawKeyboard(){
  kbCells = [];
  const rows = ['ABCDEFGHIJ', 'KLMNOPQRST', 'UVWXYZ0123', ['4','5','6','7','8','9','ESC','DEL','OK']];
  const cw = 24, chh = 21, y0 = 96;
  for(let r = 0; r < rows.length; r++){
    const items = Array.isArray(rows[r]) ? rows[r] : rows[r].split('');
    const sx = Math.round((W - items.length*cw)/2);
    for(let i = 0; i < items.length; i++){
      const x = sx + i*cw, y = y0 + r*chh, k = items[i];
      panel(x + 1, y + 1, cw - 2, chh - 2);
      const col = k === 'OK' ? C.G : ((k === 'DEL' || k === 'ESC') ? C.o : C.w);
      const lbl = k === 'DEL' ? '<' : k;
      drawText(ctx, lbl, x + Math.round((cw - textWidth(lbl))/2), y + 7, col);
      kbCells.push({x:x, y:y, w:cw, h:chh, k:k});
    }
  }
}
function drawNameEntry(){
  const c = themes[0];
  ctx.fillStyle = c.sky; ctx.fillRect(0, 0, W, H);
  for(const st of stars){ px(ctx, st.x % W, st.y, 1, 1, st.c ? c.star2 : c.star); }
  drawText(ctx, 'ASTRO', Math.round((W - textWidth('ASTRO', 2))/2), 8, C.c, 2);
  drawText(ctx, 'DASH', Math.round((W - textWidth('DASH', 2))/2), 28, C.w, 2);
  textCenter(ctx, 'ENTER YOUR NAME', 52, C.Y);
  panel(58, 66, 140, 26);
  const cur = (Math.floor(game.t/18) % 2 === 0) ? '_' : ' ';
  const txt = pilotName + cur;
  drawText(ctx, txt, Math.round((W - textWidth(txt, 2))/2), 72, C.w, 2);
  if(touchMode){
    drawKeyboard();
    textCenter(ctx, 'ESC = BACK   OK = START', 190, C.g);
  } else {
    textCenter(ctx, 'A-Z  0-9  UP TO ' + NAME_MAX, 100, C.g);
    textCenter(ctx, 'ENTER = START', 112, C.w);
    textCenter(ctx, 'BACKSPACE = DELETE   ESC = BACK', 122, C.g);
    if(Math.floor(game.t/20) % 2 === 0) textCenter(ctx, 'START TYPING', 150, C.c);
    ctx.drawImage(SPR.heroIdle, Math.round(W/2) - 8, 168);
  }
}

function drawTitle(){
  const c = themes[0];
  ctx.fillStyle = c.sky; ctx.fillRect(0, 0, W, H);
  for(const st of stars){ px(ctx, st.x % W, st.y, 1, 1, st.c ? c.star2 : c.star); }
  drawText(ctx, 'ASTRO', Math.round((W - textWidth('ASTRO', 3))/2), 24, C.c, 3);
  drawText(ctx, 'DASH', Math.round((W - textWidth('DASH', 3))/2), 50, C.w, 3);
  ctx.drawImage(SPR.heroIdle, Math.round(W/2) - 8, 84);
  if(Math.floor(game.t/20) % 2 === 0) textCenter(ctx, touchMode ? 'TAP TO START' : 'PRESS SPACE', 134, C.w);
  textCenter(ctx, 'MOVE: A/D OR ARROWS', 164, C.g);
  textCenter(ctx, 'JUMP: SPACE   RUN: SHIFT', 176, C.g);
  textCenter(ctx, 'P PAUSE   M MUTE   V CRT', 188, C.g);
  textCenter(ctx, touchMode ? 'TAP HERE: HIGH SCORES' : 'H HIGH SCORES', 200, C.g);
}
function drawOverlay(){
  if(game.state === ST.CARD){
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
    textCenter(ctx, game.card, 96, C.w, 2);
    textCenter(ctx, game.cardSub.slice(0, Math.min(24, game.cardSub.length)), 124, C.c);
    textCenter(ctx, 'LIVES X ' + Math.max(0, game.hearts), 146, C.Y);
    for(let i=0;i<3;i++) ctx.drawImage(i < game.hearts ? SPR.heart : SPR.heartEmpty, 114 + i*10, 160);
  } else if(game.state === ST.PAUSE){
    textCenter(ctx, 'PAUSED', 108, C.w, 2);
    textCenter(ctx, 'PRESS P TO RESUME', 134, C.Y);
  } else if(game.state === ST.CLEAR){
    panel(24, 96, 208, 72);
    textCenter(ctx, 'SECTOR CLEAR', 106, C.w);
    textCenter(ctx, 'ORB ' + String(game.score).padStart(6,'0'), 122, C.Y);
    if(Math.floor(game.t/20) % 2 === 0) textCenter(ctx, 'PRESS SPACE', 146, C.c);
  } else if(game.state === ST.DEAD){
    panel(24, 100, 208, 56);
    textCenter(ctx, 'NO LIVES LEFT', 112, C.o);
    textCenter(ctx, 'LIVES LEFT X' + Math.max(0, game.hearts), 132, C.g);
  } else if(game.state === ST.OVER){
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
    textCenter(ctx, 'GAME OVER', 84, C.r, 2);
    textCenter(ctx, 'ORB ' + String(game.score).padStart(6,'0'), 112, C.Y);
    if(game.rank > 0){
      textCenter(ctx, (game.improved ? 'NEW HIGH SCORE  RANK ' : 'YOUR BEST  RANK ') + game.rank, 134, C.c);
      textCenter(ctx, String(game.name).slice(0, NAME_MAX), 146, C.g);
    } else {
      textCenter(ctx, 'NOT IN THE TOP 10', 134, C.g);
    }
    textCenter(ctx, 'H = HIGH SCORES', 186, C.g);
    if(Math.floor(game.t/20) % 2 === 0) textCenter(ctx, 'PRESS SPACE', 168, C.w);
  } else if(game.state === ST.WIN){
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
    textCenter(ctx, 'MISSION COMPLETE', 60, C.c, 2);
    textCenter(ctx, 'YOU CLEARED', 92, C.w);
    textCenter(ctx, 'ALL 3 DEEP SPACE SECTORS', 104, C.w);
    ctx.drawImage(SPR.heroIdle, Math.round(W/2) - 8, 120);
    textCenter(ctx, 'FINAL SCORE ' + String(game.score).padStart(6,'0'), 150, C.Y);
    if(game.rank > 0) textCenter(ctx, (game.improved ? 'NEW HIGH SCORE  RANK ' : 'YOUR BEST  RANK ') + game.rank, 168, C.c);
    textCenter(ctx, 'H = HIGH SCORES', 206, C.g);
    if(Math.floor(game.t/20) % 2 === 0) textCenter(ctx, 'PRESS SPACE', 190, C.w);
  }
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.imageSmoothingEnabled = false;
  if(game.state === ST.TITLE){ drawTitle(); return; }
  if(game.state === ST.NAME){ drawNameEntry(); return; }
  if(game.state === ST.SCORES){ drawScores(); return; }
  ctx.save();
  if(shake > 0.4) ctx.translate(Math.round((Math.random()-0.5)*shake), Math.round((Math.random()-0.5)*shake));
  drawSky();
  drawTiles();
  drawEntities();
  ctx.restore();
  if(flash > 0) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(0,0,W,H); }
  drawHUD();
  if(game.state !== ST.PLAY) drawOverlay();
}

/* ------------------------------ input ------------------------------ */
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
                 ArrowUp:'jump', KeyW:'jump', Space:'jump',
                 ShiftLeft:'sprint', ShiftRight:'sprint' };
addEventListener('keydown', e=>{
  if(game.state === ST.NAME){                       // name entry swallows everything else
    if(e.key === 'Escape'){ backToTitle(); e.preventDefault(); return; }
    if(e.key === 'Enter' || e.key === ' '){ confirmName(); e.preventDefault(); return; }
    if(e.key === 'Backspace'){ pilotName = pilotName.slice(0, -1); e.preventDefault(); return; }
    if(/^[A-Za-z0-9]$/.test(e.key)){ if(pilotName.length < NAME_MAX) pilotName += e.key.toUpperCase(); e.preventDefault(); return; }
    return;
  }
  if(e.code === 'KeyM'){ muted = !muted; if(muted) stopMusic(); else if(game.state === ST.PLAY) startMusic(); return; }
  if(game.state === ST.SCORES && (e.code === 'Backspace' || e.code === 'Escape' || e.code === 'KeyH')){
    e.preventDefault(); e.stopPropagation(); closeScores(); return;
  }
  if(e.code === 'KeyH' && (game.state === ST.TITLE || game.state === ST.OVER || game.state === ST.WIN)){ openScores(); return; }
  if(e.code === 'KeyF'){
    e.preventDefault();
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    return;
  }
  if(e.code === 'KeyP' || e.code === 'Escape'){ e.preventDefault(); togglePause(); return; }
  if(e.code === 'KeyV'){ const c = document.getElementById('crt'); c.style.display = c.style.display === 'block' ? 'none' : 'block'; return; }
  if(e.code === 'KeyR'){ if(game.state === ST.PLAY) toCard(); return; }
  const k = KEYMAP[e.code];
  if(!k) return;
  e.preventDefault(); unlockAudio();
  if(!keys[k] && k === 'jump') jumpEdge = true;
  keys[k] = true;
  if(game.state === ST.TITLE){ if(e.code === 'Space') game.state = ST.NAME; return; }
  else if(game.state === ST.SCORES && e.code === 'Space') closeScores();
  else if(game.state !== ST.PLAY && e.code === 'Space') advance();
});
addEventListener('keyup', e=>{
  const k = KEYMAP[e.code]; if(!k) return;
  e.preventDefault(); keys[k] = false;
});
const touchMode = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const touchUI = document.getElementById('touch');
if(touchMode) touchUI.style.display = 'flex';
touchUI.querySelectorAll('.btn').forEach(b=>{
  const k = b.dataset.k;
  const on = ev=>{ ev.preventDefault(); unlockAudio(); if(!keys[k] && k === 'jump') jumpEdge = true; keys[k] = true;
    if(game.state === ST.TITLE) game.state = ST.NAME;
    else if(game.state === ST.NAME && k === 'jump') confirmName();
    else if(game.state === ST.SCORES && k === 'jump') closeScores();
    else if(game.state !== ST.PLAY && k === 'jump') advance(); };
  const off = ev=>{ ev.preventDefault(); keys[k] = false; };
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('touchcancel', off, {passive:false});
  b.addEventListener('mousedown', on); b.addEventListener('mouseup', off);
});
canvas.addEventListener('pointerdown', ev=>{
  unlockAudio();
  if(game.state === ST.TITLE){
    if(touchMode){
      const r0 = canvas.getBoundingClientRect();
      const ty = (ev.clientY - r0.top) * (H / r0.height);
      if(ty >= 194 && ty <= 214) openScores(ST.TITLE); else game.state = ST.NAME;   // score band or start
    }
    return;
  }
  if(game.state === ST.SCORES){ if(touchMode) closeScores(); return; }
  if(game.state === ST.NAME){
    const r = canvas.getBoundingClientRect();
    const k = kbHit((ev.clientX - r.left) * (W / r.width), (ev.clientY - r.top) * (H / r.height));
    if(k){ nameKey(k); return; }
    return;                                // taps outside the keys do nothing
  }
  if(game.state !== ST.PLAY && touchMode) advance();
});

/* ------------------------------ loop ------------------------------ */
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if(dt > 0.25) dt = 0.25;
  acc += dt;
  let guard = 0;
  while(acc >= 1/60 && guard++ < 6){ step(); acc -= 1/60; }
  render();
}
initSky(1);
loadLevel(0);
game.state = ST.TITLE;
requestAnimationFrame(frame);

/* test / tooling hooks */
window.__astro = {
  get scores(){ return scores; }, get pilotName(){ return pilotName; },
  get state(){ return game.state; }, get game(){ return game; }, get level(){ return level; },
  get player(){ return player; }, get enemies(){ return enemies; }, get orbs(){ return orbs; },
  get camera(){ return camera; }, ST, keys, startGame, advance, loadLevel,
  goto(i){ game.levelIndex = i; loadLevel(i); game.state = ST.PLAY; },
  press(k){ unlockAudio(); keys[k] = true; if(k === 'jump') jumpEdge = true; },
  release(k){ keys[k] = false; },
  warp(x, y){ player.x = x; player.y = y; player.vx = 0; player.vy = 0;
              camera.x = clamp(player.x + player.w/2 - W/2, 0, level.w*T - W); },
  spriteSheet(){                                   // all art at 4x for inspection
    const list = [['idle',SPR.heroIdle],['run1',SPR.heroRun1],['run2',SPR.heroRun2],
                  ['jump',SPR.heroJump],['walk1',SPR.walker1],['walk2',SPR.walker2],
                  ['drone',SPR.drone1],['orb',SPR.orb1],['heart',SPR.heart],
                  ['hull',TILE['#']],['rock',TILE['R']],['crate',TILE['B']],
                  ['beam',TILE['-']],['spike',TILE['^']],['mystery',TILE['?']],
                  ['portal',SPR.portal[1]]];
    const sc = 4, cw = 16*sc + 16, chh = 32*sc + 20, cols = 6;
    const rowsN = Math.ceil(list.length / cols);
    const cv = document.createElement('canvas');
    cv.width = cols*cw + 16; cv.height = rowsN*chh + 16;
    const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
    g.fillStyle = '#181830'; g.fillRect(0,0,cv.width,cv.height);
    list.forEach((it, i)=>{
      const col = i % cols, row = Math.floor(i / cols);
      const x = 12 + col*cw, y = 12 + row*chh;
      g.drawImage(it[1], x, y + (32*sc - it[1].height*sc), it[1].width*sc, it[1].height*sc);
      drawText(g, it[0], x, y + 32*sc + 2, C.w, 1);
    });
    return cv.toDataURL('image/png');
  },
  get artErrors(){ return window.__artErrors; },
  get textOverflow(){ return window.__textOverflow; }
};
