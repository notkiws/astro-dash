<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>ASTRO DASH - Petualangan Luar Angkasa</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#03050d;overflow:hidden;color:#cfe2ff;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#03050d;display:block;max-width:100vw;max-height:100vh;
    box-shadow:0 0 80px rgba(70,120,255,.22);touch-action:none}
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;
    padding:10px 16px 18px;pointer-events:none;z-index:10}
  #touch .side{display:flex;gap:12px;pointer-events:auto}
  .btn{width:70px;height:70px;border-radius:50%;background:rgba(80,130,240,.18);
    border:2px solid rgba(140,190,255,.5);color:#dcecff;font-size:24px;display:flex;
    align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
  .btn:active{background:rgba(120,180,255,.45)}
  .btn.jump{width:86px;height:86px;background:rgba(255,180,80,.16);border-color:rgba(255,200,120,.6)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="544"></canvas></div>
<div id="touch">
  <div class="side"><div class="btn" data-k="left">&#9664;</div><div class="btn" data-k="right">&#9654;</div></div>
  <div class="side"><div class="btn jump" data-k="jump">&#9650;</div></div>
</div>
<script>
"use strict";
const LEVELS = [
  {"name": "ORBITAL STATION", "sub": "Sector 1 - Outer Station", "theme": 0, "width": 212, "rows": ["                                                                                                                                                                                                                    ", "                                                                                                                                                                                                                    ", "                                                                                                                                                                                                                    ", "                                                                                                                                                                                                                    ", "                                                                                                                                                                                                                    ", "                                                                                                                                                                                                                    ", "                                                                                                                f                                                                                                   ", "                                                                  f                                 o o                                                         f                                                   ", "                                                                                                    ----                                                o o o                                                       ", "                                                          o o o                             o o                                   o o                   -----                                 o o                   ", "          o o                    o o o     oo             -----                  oo         ----                           oo     ----                                    oo                  ----                  ", "       ?  ----                   -----    ----  ??                              ----                          ??          ----                        ?                  ----                       ?               ", "      o o       BB                                                      BB             o o o                                                       BB              o o                                o o           ", "   P            BB  e   e    ^^^                    e   e             ^ BB                     e   e   e  ^^                           e   e  ^^^  BB                               e   e   ^                G      ", "###########################################  ####################################  ########################################  #############################################  ########################################", "###########################################  ####################################  ########################################  #############################################  ########################################", "###########################################  ####################################  ########################################  #############################################  ########################################"]},
  {"name": "ASTEROID BELT", "sub": "Sector 2 - Asteroid Belt", "theme": 1, "width": 232, "rows": ["                                                                                                                                                                                                                                        ", "                                                                                                                                                                                                                                        ", "                                                                                                                                                                                                                                        ", "                                                                                                                                                                                                                                        ", "                                                                                                                                                                                                                                        ", "                                                                                                                                                                                                                                        ", "                                                                                          f                                                                                                                                             ", "                                                      f                                                                                                     f                                                                           ", "                              f                     o o                             o o                               f                               o o o                                 f                                           ", "                                    o o o           ---                             ----                    o o                                       -----                                                                             ", "              o o             oo    -----                     oo                                oo          ----                oo                                oo          o o                 oo                                    ", "              ----           ----                            ----                    ??        ----                            ----                   ?          ----         ----               ----             ?                     ", "      o o o                                       BB                                                              BBB   o o                                                             BB              o o o         o o               ", "   P    Re  R       ^^^ e             e R e R ^^  BB                e R e   e   ^^^     R             e R e   ^^  BBB                 e R e   e   ^^^                   e R e       ^^  BB                R   e     ^         G         ", "RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR", "RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR", "RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRR  RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR"]},
  {"name": "ALIEN MOTHERSHIP", "sub": "Sector 3 - Mothership Core", "theme": 2, "width": 252, "rows": ["############################################################################################################################################################################################################################################################", "############################################################################################################################################################################################################################################################", "                                                                                                                                                                                                                                                            ", "                                                                                                                                                                                                                                                            ", "                                                                                                                                                                                                                                                            ", "                                                                                                                                                                                                                                                            ", "                                                                                                                                                                                                                                                            ", "                                                                                          f     f                                         f                                     f                                                                           ", "                                                      f       o o                   o o                                     f     o o o                      f                                             f                                                ", "                                                o o o         ----                  ----                        o o o             -----               o o o           o o                     o o o                                                         ", "                  o o            oo    f        -----                oo     o o                            oo   -----                            oo   -----           ----             oo     -----                          oo                 o o         ", "        ??        ----          ----                        ??      ----    ----            ??            ----                ???               ----                  ?               ----             ??                   ----      ?         ----        ", "            o o o                         BBB                                                     BBBo o                                  BBB                               BBB o o                         BBB o o o               o o o                   ", "   P          e         e  e^^            BBB e   e     ^^^                e   e   e  ^^^         BBB            e   e  ^^^       e   e   BBB          e   e   e  ^^^       BBB              e   e  ^^      BBB       e                     ^^^       G     ", "#################################  ##################################  ####################################  ####################################  ####################################  ####################################  #############################", "#################################  ##################################  ####################################  ####################################  ####################################  ####################################  #############################", "#################################  ##################################  ####################################  ####################################  ####################################  ####################################  #############################"]}
];

/* ============================ CORE ============================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const VW = canvas.width, VH = canvas.height, TILE = 32;
const ST = { TITLE:0, PLAY:1, PAUSE:2, CLEAR:3, DEAD:4, OVER:5, WIN:6, NAME:7, SCORES:8 };

const PHYS = { G:0.62, JUMP:-13.4, MAXFALL:15, ACC:0.85, FRIC:0.80, AIR:0.94,
               MAXRUN:4.6, MAXSPRINT:6.5, COYOTE:7, BUFFER:7 };

const keys = { left:false, right:false, jump:false, sprint:false };
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
                 ArrowUp:'jump', KeyW:'jump', Space:'jump',
                 ShiftLeft:'sprint', ShiftRight:'sprint' };
let jumpEdge = false;

const game = {
  state: ST.TITLE, levelIndex:0, score:0, hearts:3, t:0,
  msg:'', timer:0, best:0, started:false
};
let camera = { x:0, y:0 };
let level = null, player = null, enemies = [], orbs = [], parts = [], pops = [];
let shake = 0;

/* ============================ AUDIO ============================ */
let ac = null, muted = false;
function unlockAudio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } }
  if(ac && ac.state === 'suspended') ac.resume();
}
function tone(f, dur, type, vol, slideTo){
  if(muted) return; unlockAudio(); if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, ac.currentTime);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), ac.currentTime+dur);
  g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+0.02);
}
const sfx = {
  jump(){ tone(420, 0.14, 'square', 0.045, 780); },
  coin(){ tone(980, 0.07, 'triangle', 0.05); setTimeout(()=>tone(1460,0.10,'triangle',0.045), 60); },
  stomp(){ tone(220, 0.12, 'sawtooth', 0.05, 90); },
  bump(){ tone(140, 0.07, 'square', 0.04); },
  hurt(){ tone(340, 0.28, 'sawtooth', 0.05, 70); },
  clear(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.05), i*110)); },
  over(){ [392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'square',0.05), i*160)); },
  portal(){ [440,554,659,880,1109].forEach((f,i)=>setTimeout(()=>tone(f,0.22,'triangle',0.045), i*90)); }
};

/* ============================ INPUT ============================ */
addEventListener('keydown', e=>{
  if(game.state === ST.NAME){                       // name entry swallows everything else
    if(e.key === 'Escape'){ backToTitle(); e.preventDefault(); return; }
    if(e.key === 'Enter' || e.key === ' '){ confirmName(); e.preventDefault(); return; }
    if(e.key === 'Backspace'){ pilotName = pilotName.slice(0, -1); e.preventDefault(); return; }
    if(/^[A-Za-z0-9]$/.test(e.key)){ if(pilotName.length < NAME_MAX) pilotName += e.key.toUpperCase(); e.preventDefault(); return; }
    return;
  }
  if(e.code === 'KeyM'){ muted = !muted; return; }
  if(game.state === ST.SCORES && (e.code === 'Backspace' || e.code === 'Escape' || e.code === 'KeyH')){
    e.preventDefault(); e.stopPropagation(); closeScores(); return;
  }
  if(e.code === 'KeyH' && (game.state === ST.TITLE || game.state === ST.OVER || game.state === ST.WIN)){ openScores(); return; }
  if(e.code === 'KeyF'){
    e.preventDefault();
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    return;
  }
  if(e.code === 'KeyP' || e.code === 'Escape'){ e.preventDefault(); togglePause(); return; }
  if(e.code === 'KeyR'){ if(game.state === ST.PLAY || game.state === ST.PAUSE) softRestart(); return; }
  const k = KEYMAP[e.code];
  if(!k) return;
  e.preventDefault(); unlockAudio();
  if(!keys[k] && k === 'jump') jumpEdge = true;
  keys[k] = true;
  if(game.state === ST.TITLE){ if(e.code === 'Space') game.state = ST.NAME; return; }
  else if(game.state === ST.SCORES && e.code === 'Space') closeScores();
  else if(game.state === ST.CLEAR || game.state === ST.DEAD || game.state === ST.OVER || game.state === ST.WIN){
    if(e.code === 'Space') advance();
  }
});
addEventListener('keyup', e=>{
  const k = KEYMAP[e.code]; if(!k) return;
  e.preventDefault(); keys[k] = false;
});

const touchUI = document.getElementById('touch');
const touchMode = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if(touchMode) touchUI.style.display = 'flex';
touchUI.querySelectorAll('.btn').forEach(b=>{
  const k = b.dataset.k;
  const on = ev=>{ ev.preventDefault(); unlockAudio(); if(!keys[k] && k==='jump') jumpEdge = true; keys[k]=true;
                   if(game.state===ST.TITLE) game.state = ST.NAME;
                   else if(game.state===ST.NAME && k==='jump') confirmName();
                   else if(game.state===ST.SCORES && k==='jump') closeScores();
                   else if(game.state!==ST.PLAY && k==='jump') advance(); };
  const off = ev=>{ ev.preventDefault(); keys[k]=false; };
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('touchcancel', off, {passive:false});
  b.addEventListener('mousedown', on); b.addEventListener('mouseup', off);
});
canvas.addEventListener('pointerdown', ev=>{
  unlockAudio();
  if(game.state === ST.TITLE){
    if(touchMode){
      const r0 = canvas.getBoundingClientRect();
      const ty = (ev.clientY - r0.top) * (VH / r0.height);
      if(ty >= 476 && ty <= 504) openScores(ST.TITLE); else game.state = ST.NAME;   // tap the hint line for scores
    }
    return;
  }
  if(game.state === ST.SCORES){ if(touchMode) closeScores(); return; }
  if(game.state === ST.NAME){
    const r = canvas.getBoundingClientRect();
    const k = kbHit((ev.clientX - r.left) * (VW / r.width), (ev.clientY - r.top) * (VH / r.height));
    if(k){ nameKey(k); return; }
    return;                                 // taps outside the keys do nothing
  }
  if(game.state !== ST.PLAY && touchMode){ advance(); }
});

/* ============================ LEVEL ============================ */
function isSolid(ch){ return ch === '#' || ch === 'R' || ch === 'B' || ch === '?'; }
function isOneWay(ch){ return ch === '-'; }
function tileCh(cx, cy){
  if(cy < 0 || cy >= level.h) return ' ';
  if(cx < 0 || cx >= level.w) return '#';
  return level.tiles[cy][cx];
}
function solidAt(px, py){ return isSolid(tileCh(Math.floor(px/TILE), Math.floor(py/TILE))); }

function loadLevel(i){
  const def = LEVELS[i];
  const w = def.width, h = def.rows.length;
  const tiles = def.rows.map(r=>r.split(''));
  level = { def, w, h, tiles, theme:def.theme, name:def.name, sub:def.sub };
  enemies = []; orbs = []; parts = []; pops = [];
  let spawn = {x: 3*TILE, y: 12*TILE};
  for(let y=0; y<h; y++){
    for(let x=0; x<w; x++){
      const ch = tiles[y][x];
      if(ch === 'P'){ spawn = {x: x*TILE + 3, y: y*TILE + 4}; tiles[y][x] = ' '; }
      else if(ch === 'e'){ enemies.push(mkWalker(x*TILE, y*TILE)); tiles[y][x] = ' '; }
      else if(ch === 'f'){ enemies.push(mkDrone(x*TILE, y*TILE)); tiles[y][x] = ' '; }
      else if(ch === 'o'){ orbs.push({x: x*TILE+16, y: y*TILE+16, taken:false, a: Math.random()*6.28}); tiles[y][x] = ' '; }
      else if(ch === 'G'){ level.goal = {x: x*TILE, y: y*TILE, taken:false}; tiles[y][x] = ' '; }
    }
  }
  if(!level.goal) level.goal = {x:(w-6)*TILE, y:13*TILE};
  player = { x:spawn.x, y:spawn.y, w:26, h:38, vx:0, vy:0, onGround:false, face:1,
             anim:0, inv:0, coyote:0, buf:0, jumpHeld:false, anim2:0,
             safe:{x:spawn.x, y:spawn.y} };
  camera.x = clamp(player.x + player.w/2 - VW/2, 0, w*TILE - VW);
  camera.y = clamp(player.y + player.h/2 - VH/2, 0, h*TILE - VH);
  game.msg = ''; game.timer = 0;
}
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

/* ============================ ENTITIES ============================ */
function mkWalker(x,y){ return { t:'walker', x:x+5, y:y+6, w:24, h:26, vx:-0.95, vy:0, alive:true, a:Math.random()*6.28, base:y+6 }; }
function mkDrone(x,y){ return { t:'drone', x:x+2, y:y+2, w:28, h:24, vx:-1.15, vy:0, alive:true, a:Math.random()*6.28, base:y+2, range:96, ox:x }; }

function burst(x, y, n, col, spd){
  for(let i=0;i<n;i++){
    const ang = Math.random()*6.283, s = (spd||2)*(0.35+Math.random());
    parts.push({x, y, vx:Math.cos(ang)*s, vy:Math.sin(ang)*s - 0.6, life:1,
                col: col, r: 1.5+Math.random()*2.5});
  }
}
function popup(x, y, text, col){ pops.push({x, y, text, col: col||'#ffe9a8', life:1}); }

function moveX(e){
  e.x += e.vx; e.hitWall = 0;
  const ys = [e.y+3, e.y+e.h/2, e.y+e.h-3];
  if(e.vx > 0){
    const cx = Math.floor((e.x+e.w)/TILE);
    if(ys.some(py=>isSolid(tileCh(cx, Math.floor(py/TILE))))){
      e.x = cx*TILE - e.w - 0.01; e.vx = 0; e.hitWall = 1;
    }
  } else if(e.vx < 0){
    const cx = Math.floor(e.x/TILE);
    if(ys.some(py=>isSolid(tileCh(cx, Math.floor(py/TILE))))){
      e.x = (cx+1)*TILE + 0.01; e.vx = 0; e.hitWall = -1;
    }
  }
}
function moveY(e){
  const prevBottom = e.y + e.h;
  e.y += e.vy; e.onGround = false;
  const xs = [e.x+3, e.x+e.w/2, e.x+e.w-3];
  if(e.vy > 0){
    const cy = Math.floor((e.y+e.h)/TILE);
    for(const px of xs){
      const cx = Math.floor(px/TILE), ch = tileCh(cx, cy);
      if(isSolid(ch) || (isOneWay(ch) && prevBottom <= cy*TILE + 3)){
        e.y = cy*TILE - e.h - 0.01; e.vy = 0; e.onGround = true; break;
      }
    }
  } else if(e.vy < 0){
    const cy = Math.floor(e.y/TILE);
    for(const px of xs){
      const cx = Math.floor(px/TILE), ch = tileCh(cx, cy);
      if(isSolid(ch)){
        e.y = (cy+1)*TILE + 0.01; e.vy = 0; e.headHit = {cx, cy}; break;
      }
    }
  }
}
function overlap(a, b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

/* ============================ GAME FLOW ============================ */
function startGame(){
  game.state = ST.PLAY; game.levelIndex = 0; game.score = 0; game.hearts = 3;
  game.started = true; game.submitted = false; game.rank = 0; loadLevel(0);
}
function softRestart(){
  if(game.hearts > 0) loadLevel(game.levelIndex);
  game.state = ST.PLAY;
}
function togglePause(){
  if(game.state === ST.PLAY) game.state = ST.PAUSE;
  else if(game.state === ST.PAUSE) game.state = ST.PLAY;
}
function advance(){
  if(game.t - (game.lastAdv || -999) < 30) return;   // ignore key repeat: one press, one screen
  game.lastAdv = game.t;
  if(game.state === ST.CLEAR){
    game.levelIndex++;
    if(game.levelIndex >= LEVELS.length){ game.state = ST.WIN; finishRun(); }
    else { loadLevel(game.levelIndex); game.state = ST.PLAY; }
  } else if(game.state === ST.DEAD){
    if(game.hearts > 0){ respawnAtCheckpoint(); }
    else { game.state = ST.OVER; finishRun(); }
  } else if(game.state === ST.OVER || game.state === ST.WIN){
    game.state = ST.TITLE; game.started = false;
  }
}
function hurt(fromX){
  if(player.inv > 0 || game.state !== ST.PLAY) return;
  game.hearts--; player.inv = 110; shake = 10; sfx.hurt();
  // knock the hero away from whatever hit him, otherwise he just keeps standing in it
  const dir = (fromX === undefined) ? -player.face : (player.x + player.w/2 < fromX ? -1 : 1);
  player.vx = dir * 5.5; player.vy = -7.2; player.onGround = false; player.buf = 0;
  burst(player.x+player.w/2, player.y+player.h/2, 16, '#ff7a7a', 3);
  if(game.hearts <= 0){ game.state = ST.DEAD; sfx.over(); }
}
function respawnAtCheckpoint(){
  const s = player.safe || {x: player.x, y: player.y};
  player.x = s.x; player.y = s.y - 2; player.vx = 0; player.vy = 0;
  player.inv = 110; player.onGround = false;
  camera.x = clamp(player.x + player.w/2 - VW/2, 0, Math.max(0, level.w*TILE - VW));
  burst(player.x + player.w/2, player.y + player.h/2, 18, '#9fd8ff', 2.6);
  game.state = ST.PLAY; game.timer = 0;
}
function killPlayer(){
  if(game.state !== ST.PLAY) return;
  game.hearts--; shake = 12; sfx.hurt();
  burst(player.x+player.w/2, player.y+player.h/2, 22, '#8fd0ff', 3.4);
  game.state = ST.DEAD; if(game.hearts <= 0) setTimeout(()=>sfx.over(), 350);
}

/* ============================ STEP ============================ */
function step(){
  game.t++;
  if(game.state === ST.PLAY) updatePlay();
  else if(game.state === ST.CLEAR || game.state === ST.DEAD){
    game.timer++;
    if(game.timer > 150) advance();
  }
  if(shake > 0) shake *= 0.88;
  for(const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.99; p.life -= 0.026;
  }
  parts = parts.filter(p=>p.life > 0);
  for(const p of pops){ p.y -= 0.7; p.life -= 0.022; }
  pops = pops.filter(p=>p.life > 0);
  updateCamera();
}
function updateCamera(){
  if(!level) return;
  const tx = clamp(player.x + player.w/2 - VW/2, 0, Math.max(0, level.w*TILE - VW));
  const ty = clamp(player.y + player.h/2 - VH/2 + 40, 0, Math.max(0, level.h*TILE - VH));
  camera.x += (tx - camera.x) * 0.14;
  camera.y += (ty - camera.y) * 0.14;
}
function updatePlay(){
  const p = player;
  /* --- horizontal --- */
  const maxSpd = keys.sprint ? PHYS.MAXSPRINT : PHYS.MAXRUN;
  if(keys.left && !keys.right){ p.vx -= PHYS.ACC; p.face = -1; }
  else if(keys.right && !keys.left){ p.vx += PHYS.ACC; p.face = 1; }
  else { p.vx *= p.onGround ? PHYS.FRIC : PHYS.AIR; if(Math.abs(p.vx) < 0.05) p.vx = 0; }
  p.vx = clamp(p.vx, -maxSpd, maxSpd);

  /* --- jump --- */
  if(jumpEdge){ p.buf = PHYS.BUFFER; jumpEdge = false; }
  if(p.buf > 0) p.buf--;
  if(p.onGround) p.coyote = PHYS.COYOTE; else if(p.coyote > 0) p.coyote--;
  if(p.buf > 0 && p.coyote > 0){
    p.vy = PHYS.JUMP; p.onGround = false; p.coyote = 0; p.buf = 0;
    sfx.jump(); burst(p.x+p.w/2, p.y+p.h, 6, '#9fd8ff', 1.6);
  }
  if(!keys.jump && p.vy < -10.7) p.vy = -10.7;   // min hop ~3.4 tiles, held jump ~4.3 tiles

  /* --- gravity --- */
  p.vy = Math.min(p.vy + PHYS.G, PHYS.MAXFALL);

  moveX(p); moveY(p);
  if(p.headHit){
    const {cx, cy} = p.headHit;
    if(tileCh(cx,cy) === '?'){
      level.tiles[cy][cx] = 'u';
      orbs.push({x: cx*TILE+16, y: cy*TILE-10, taken:false, a:0, vy:-6, bounce:true});
      game.score += 5; sfx.bump();
      burst(cx*TILE+16, cy*TILE+16, 8, '#ffd479', 2);
    } else sfx.bump();
    p.headHit = null;
  }
  if(p.onGround){
    const below = tileCh(Math.floor((p.x + p.w/2)/TILE), Math.floor((p.y + p.h + 3)/TILE));
    if(below === '#' || below === 'R') p.safe = {x: p.x, y: p.y};
  }
  p.anim += Math.abs(p.vx) * 0.16;
  p.anim2 += 0.1;

  /* --- orbs --- */
  for(const o of orbs){
    if(o.bounce){ o.vy += 0.34; o.y += o.vy; }
    if(o.taken) continue;
    if(!o.bounce) o.y += Math.sin(game.t*0.06 + o.a) * 0.25;
    const box = {x:o.x-15, y:o.y-15, w:30, h:30};
    if(overlap(p, box)){
      o.taken = true; game.score += 10; sfx.coin();
      burst(o.x, o.y, 9, '#7fe7ff', 2); popup(o.x, o.y-12, '+10');
    }
  }
  orbs = orbs.filter(o=>!o.taken && o.y < level.h*TILE + 200);

  /* --- enemies --- */
  for(const e of enemies){
    if(!e.alive) continue;
    if(Math.abs(e.x - p.x) > 1400) continue;
    if(e.t === 'walker'){
      e.a += 0.12;
      e.vy = Math.min(e.vy + PHYS.G, PHYS.MAXFALL);
      // avoid walking off ledges
      const aheadX = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      const belowSolid = solidAt(aheadX, e.y + e.h + 6) ||
        isOneWay(tileCh(Math.floor(aheadX/TILE), Math.floor((e.y+e.h+6)/TILE)));
      if(!belowSolid) e.vx = -e.vx;
      moveX(e);
      if(e.hitWall) e.vx = -e.hitWall * 0.95;
      moveY(e);
    } else {
      e.a += 0.08;
      e.x += e.vx;
      if(Math.abs(e.x - e.ox) > e.range) e.vx = -e.vx;
      e.y = e.base + Math.sin(e.a) * 26;
    }
    if(overlap(p, e)){
      const feet = p.y + p.h;
      if(p.vy > 0.5 && feet - e.y < 20){
        e.alive = false; game.score += 25; sfx.stomp(); shake = 5;
        p.vy = keys.jump ? -12.5 : -9.5;
        burst(e.x+e.w/2, e.y+e.h/2, 14, e.t === 'walker' ? '#7de08a' : '#b39cff', 3);
        popup(e.x+e.w/2, e.y, '+25');
      } else hurt(e.x + e.w/2);
    }
  }

  /* --- hazards --- */
  const feetRow = Math.floor((p.y + p.h - 4)/TILE);
  for(let i=0;i<3;i++){
    const px = p.x + 4 + i*(p.w-8)/2;
    if(tileCh(Math.floor(px/TILE), feetRow) === '^'){ hurt(); break; }
  }

  /* --- portal --- */
  if(level.goal && !level.goal.taken){
    const gb = {x:level.goal.x, y:level.goal.y-72, w:32, h:136};
    if(overlap(p, gb)){
      level.goal.taken = true;
      game.score += 200;
      sfx.clear(); sfx.portal();
      burst(gb.x+14, gb.y+28, 40, '#b78cff', 4);
      game.state = ST.CLEAR; game.timer = 0;
    }
  }

  /* --- void --- */
  if(p.y > level.h*TILE + 60) killPlayer();
  if(p.inv > 0) p.inv--;
}

/* ============================ DRAW HELPERS ============================ */
function rr(g, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r, y); g.lineTo(x+w-r, y); g.quadraticCurveTo(x+w, y, x+w, y+r);
  g.lineTo(x+w, y+h-r); g.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  g.lineTo(x+r, y+h); g.quadraticCurveTo(x, y+h, x, y+h-r);
  g.lineTo(x, y+r); g.quadraticCurveTo(x, y, x+r, y); g.closePath();
}

/* ============================ BACKGROUND ============================ */
const themeCfg = [
  { sky:['#0a1a3c','#04070f'], neb:['rgba(60,110,220,0.20)','rgba(120,80,220,0.15)'],
    planet:'#1d3f7d', planetEdge:'#4a86e8', ring:'rgba(150,200,255,0.35)', rock:'#25304d' },
  { sky:['#26160f','#050409'], neb:['rgba(200,120,60,0.16)','rgba(120,60,140,0.16)'],
    planet:'#5a3a26', planetEdge:'#c98a4b', ring:'rgba(255,200,140,0.28)', rock:'#4a3a30' },
  { sky:['#1c0b2e','#04030a'], neb:['rgba(140,60,220,0.20)','rgba(40,200,160,0.14)'],
    planet:'#3a1a5c', planetEdge:'#a56bff', ring:'rgba(190,150,255,0.32)', rock:'#33265a' }
];
let stars = null, dust = [];
function initSky(){
  stars = [];
  for(let l=0;l<3;l++){
    const n = [90, 55, 32][l], arr = [];
    for(let i=0;i<n;i++) arr.push({ x: Math.random()*2400, y: Math.random()*700,
      r: [0.7,1.2,1.9][l]*(0.7+Math.random()*0.7), p: Math.random()*6.28,
      c: Math.random()<0.12 ? '#ffd9a0' : (Math.random()<0.2 ? '#a9c8ff' : '#ffffff') });
    stars.push(arr);
  }
  dust = [];
  for(let i=0;i<40;i++) dust.push({ x:Math.random()*1200, y:Math.random()*600, s:0.2+Math.random()*0.6 });
}
initSky();

function drawBackground(){
  const cfg = themeCfg[level ? level.theme : 0];
  const grd = ctx.createLinearGradient(0,0,0,VH);
  grd.addColorStop(0, cfg.sky[0]); grd.addColorStop(1, cfg.sky[1]);
  ctx.fillStyle = grd; ctx.fillRect(0,0,VW,VH);

  // nebulae
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<4;i++){
    const px = ((i*760 - camera.x*0.12) % 2600 + 2600) % 2600 - 400;
    const py = 90 + i*120 - camera.y*0.08;
    const r = 260 + i*40;
    const g2 = ctx.createRadialGradient(px, py, 0, px, py, r);
    g2.addColorStop(0, cfg.neb[i%2]); g2.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g2; ctx.fillRect(px-r, py-r, r*2, r*2);
  }
  // stars
  const fac = [0.05, 0.12, 0.22];
  for(let l=0;l<3;l++){
    for(const s of stars[l]){
      const x = ((s.x - camera.x*fac[l]) % 2400 + 2400) % 2400 - 200;
      const y = ((s.y - camera.y*fac[l]*0.5) % 700 + 700) % 700 - 80;
      const tw = 0.55 + 0.45*Math.sin(game.t*0.05 + s.p);
      ctx.globalAlpha = tw * (0.35 + l*0.25);
      ctx.fillStyle = s.c;
      ctx.beginPath(); ctx.arc(x, y, s.r, 0, 6.283); ctx.fill();
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // distant planet (parallax 1)
  const px1 = 300 - camera.x*0.06, py1 = 150 - camera.y*0.05;
  ctx.save();
  ctx.globalAlpha = 0.85;
  const pg = ctx.createRadialGradient(px1-30, py1-30, 10, px1, py1, 120);
  pg.addColorStop(0, cfg.planetEdge); pg.addColorStop(1, cfg.planet);
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px1, py1, 110, 0, 6.283); ctx.fill();
  ctx.strokeStyle = cfg.ring; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.ellipse(px1, py1, 190, 44, -0.32, 0, 6.283); ctx.stroke();
  ctx.globalAlpha = 0.25; ctx.strokeStyle = cfg.ring; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(px1, py1, 215, 52, -0.32, 0, 6.283); ctx.stroke();
  ctx.restore();

  // second small moon
  const px2 = 1200 - camera.x*0.1, py2 = 90 - camera.y*0.06;
  ctx.save(); ctx.globalAlpha = 0.6;
  ctx.fillStyle = cfg.rock; ctx.beginPath(); ctx.arc(px2, py2, 42, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath(); ctx.arc(px2-12, py2-12, 42, 0, 6.283); ctx.fill();
  ctx.restore();

  // far debris
  ctx.save(); ctx.globalAlpha = 0.65;
  for(let i=0;i<9;i++){
    const bx = ((i*430 - camera.x*0.32) % 3600 + 3600) % 3600 - 500;
    const by = 400 - (i%3)*90 - camera.y*0.2;
    ctx.fillStyle = cfg.rock;
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.lineTo(bx+70, by+14); ctx.lineTo(bx+52, by+56);
    ctx.lineTo(bx+12, by+48); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx+70, by+14); ctx.lineTo(bx+40, by+22); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // near dust (parallax fast)
  ctx.save();
  ctx.fillStyle = 'rgba(180,215,255,0.5)';
  for(const d of dust){
    const x = ((d.x - camera.x*0.75) % 1200 + 1200) % 1200 - 120;
    const y = ((d.y - camera.y*0.6 + game.t*d.s*0.6) % 600 + 600) % 600 - 60;
    ctx.globalAlpha = 0.10 + d.s*0.25;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.restore();
}

/* ============================ TILE DRAWING ============================ */
function drawTiles(){
  const cfg = themeCfg[level.theme];
  const x0 = Math.max(0, Math.floor(camera.x/TILE) - 1);
  const x1 = Math.min(level.w-1, Math.ceil((camera.x+VW)/TILE) + 1);
  const y0 = Math.max(0, Math.floor(camera.y/TILE) - 1);
  const y1 = Math.min(level.h-1, Math.ceil((camera.y+VH)/TILE) + 1);
  for(let y=y0; y<=y1; y++){
    for(let x=x0; x<=x1; x++){
      const ch = level.tiles[y][x];
      if(ch === ' ') continue;
      const px = x*TILE - camera.x, py = y*TILE - camera.y;
      const openAbove = !isSolid(tileCh(x, y-1));
      switch(ch){
        case '#': {
          ctx.fillStyle = '#15203a'; ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = '#1e2c4d'; ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
          ctx.strokeStyle = 'rgba(120,170,255,0.10)'; ctx.lineWidth = 1;
          ctx.strokeRect(px+2.5, py+2.5, TILE-5, TILE-5);
          ctx.fillStyle = 'rgba(150,190,255,0.22)';
          [[6,6],[TILE-6,6],[6,TILE-6],[TILE-6,TILE-6]].forEach(([a,b])=>{
            ctx.beginPath(); ctx.arc(px+a, py+b, 1.6, 0, 6.283); ctx.fill();
          });
          if(openAbove){
            ctx.fillStyle = '#4877c4'; ctx.fillRect(px, py, TILE, 4);
            ctx.fillStyle = 'rgba(150,210,255,0.55)'; ctx.fillRect(px, py, TILE, 1.5);
          }
          break;
        }
        case 'R': {
          ctx.fillStyle = '#2c2536'; ctx.fillRect(px, py, TILE, TILE);
          ctx.fillStyle = cfg.rock; ctx.fillRect(px+1, py+1, TILE-2, TILE-2);
          ctx.fillStyle = 'rgba(0,0,0,0.16)';
          ctx.beginPath(); ctx.arc(px+9, py+12, 3, 0, 6.283); ctx.fill();
          ctx.beginPath(); ctx.arc(px+22, py+21, 4, 0, 6.283); ctx.fill();
          if(openAbove){
            ctx.fillStyle = '#7d6a8a'; ctx.fillRect(px, py, TILE, 5);
            ctx.fillStyle = 'rgba(255,235,255,0.18)'; ctx.fillRect(px, py, TILE, 2);
          }
          break;
        }
        case '-': {
          ctx.save();
          ctx.shadowColor = 'rgba(110,230,255,0.9)'; ctx.shadowBlur = 14;
          const grd = ctx.createLinearGradient(px, py, px+TILE, py);
          grd.addColorStop(0, 'rgba(80,200,255,0.15)');
          grd.addColorStop(0.5, 'rgba(150,240,255,0.95)');
          grd.addColorStop(1, 'rgba(80,200,255,0.15)');
          ctx.fillStyle = grd; ctx.fillRect(px, py+8, TILE, 7);
          ctx.restore();
          ctx.fillStyle = 'rgba(120,200,255,0.25)'; ctx.fillRect(px, py+15, TILE, 3);
          break;
        }
        case 'B': {
          ctx.fillStyle = '#243050'; rr(ctx, px+1, py+1, TILE-2, TILE-2, 4); ctx.fill();
          ctx.strokeStyle = '#4f7bc0'; ctx.lineWidth = 2; rr(ctx, px+2, py+2, TILE-4, TILE-4, 3); ctx.stroke();
          ctx.strokeStyle = 'rgba(255,185,80,0.85)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(px+5, py+5); ctx.lineTo(px+TILE-5, py+TILE-5);
          ctx.moveTo(px+TILE-5, py+5); ctx.lineTo(px+5, py+TILE-5); ctx.stroke();
          break;
        }
        case '?': {
          const pulse = 0.5 + 0.5*Math.sin(game.t*0.08);
          ctx.save();
          ctx.shadowColor = 'rgba(120,220,255,'+(0.5+0.4*pulse)+')'; ctx.shadowBlur = 18;
          ctx.fillStyle = '#2a3f6d'; rr(ctx, px+1, py+1, TILE-2, TILE-2, 5); ctx.fill();
          ctx.restore();
          ctx.strokeStyle = 'rgba(180,240,255,'+(0.6+0.4*pulse)+')'; ctx.lineWidth = 2;
          rr(ctx, px+2.5, py+2.5, TILE-5, TILE-5, 4); ctx.stroke();
          ctx.fillStyle = 'rgba(210,245,255,'+(0.75+0.25*pulse)+')';
          ctx.font = 'bold 18px ui-monospace,monospace'; ctx.textAlign = 'center';
          ctx.fillText('?', px+TILE/2, py+TILE/2+6.5);
          break;
        }
        case 'u': {
          ctx.fillStyle = '#1a2340'; rr(ctx, px+1, py+1, TILE-2, TILE-2, 5); ctx.fill();
          ctx.strokeStyle = 'rgba(90,130,200,0.5)'; ctx.lineWidth = 2;
          rr(ctx, px+2.5, py+2.5, TILE-5, TILE-5, 4); ctx.stroke();
          break;
        }
        case '^': {
          const a = 0.6 + 0.4*Math.sin(game.t*0.15 + x);
          ctx.fillStyle = '#2a1526'; ctx.fillRect(px, py+18, TILE, 14);
          ctx.save();
          ctx.shadowColor = 'rgba(255,90,110,0.9)'; ctx.shadowBlur = 12*a;
          for(let i=0;i<3;i++){
            const bx = px + 3 + i*10;
            const g3 = ctx.createLinearGradient(bx, py+TILE, bx, py+6);
            g3.addColorStop(0, 'rgba(255,60,90,0.95)');
            g3.addColorStop(1, 'rgba(255,200,120,'+(0.5+0.5*a)+')');
            ctx.fillStyle = g3;
            ctx.beginPath(); ctx.moveTo(bx, py+TILE); ctx.lineTo(bx+5, py+6-a*3); ctx.lineTo(bx+10, py+TILE);
            ctx.closePath(); ctx.fill();
          }
          ctx.restore();
          break;
        }
      }
    }
  }
}

/* ============================ CHARACTER ============================ */
function drawHero(g, cx, feetY, scale, face, running, airborne, t, alpha){
  const ctx = g;
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.translate(cx, feetY);
  ctx.scale(scale*face, scale);
  const sw = running ? Math.sin(t*0.35) : 0;
  const bob = running ? -Math.abs(Math.sin(t*0.35))*1.2 : Math.sin(t*0.08)*0.5;

  // ---- cape (behind) ----
  const flap = Math.sin(t*0.16)*(running?5:3) + (airborne?6:0);
  ctx.save();
  ctx.translate(0, bob);
  ctx.beginPath();
  ctx.moveTo(-6, -30);
  ctx.quadraticCurveTo(-20-flap*0.6, -22, -16-flap, -6 - (airborne?6:0));
  ctx.quadraticCurveTo(-10, -12, -5, -14);
  ctx.closePath();
  const cg = ctx.createLinearGradient(-18, -30, -2, -8);
  cg.addColorStop(0, '#5b86e0'); cg.addColorStop(1, '#2f4d9c');
  ctx.fillStyle = cg; ctx.fill();
  ctx.strokeStyle = 'rgba(160,200,255,0.45)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  // ---- legs & boots ----
  const lift = airborne ? 3 : 0;
  const l1 = running ? sw*5 : 0, l2 = running ? -sw*5 : 0;
  // left leg
  ctx.save(); ctx.translate(-5 + l1*0.4, bob);
  ctx.fillStyle = '#4f79d6'; rr(ctx, -3, -16 + lift, 7, 11, 2.5); ctx.fill();
  ctx.fillStyle = '#f2f6ff'; rr(ctx, -4.5, -7 - Math.max(0, l1*0.4) + lift*0.4, 10, 8, 3.5); ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,230,0.55)'; ctx.lineWidth = 1; rr(ctx, -4.5, -7 - Math.max(0, l1*0.4) + lift*0.4, 10, 8, 3.5); ctx.stroke();
  ctx.fillStyle = 'rgba(190,215,255,0.9)'; rr(ctx, -4, -2.5 + lift*0.4, 9, 2.5, 1); ctx.fill();
  ctx.restore();
  // right leg
  ctx.save(); ctx.translate(4 + l2*0.4, bob);
  ctx.fillStyle = '#3f68c2'; rr(ctx, -3, -16 + lift, 7, 11, 2.5); ctx.fill();
  ctx.fillStyle = '#e8eeff'; rr(ctx, -4.5, -7 - Math.max(0, l2*0.4) + lift*0.4, 10, 8, 3.5); ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,230,0.55)'; ctx.lineWidth = 1; rr(ctx, -4.5, -7 - Math.max(0, l2*0.4) + lift*0.4, 10, 8, 3.5); ctx.stroke();
  ctx.restore();

  // ---- torso ----
  ctx.save(); ctx.translate(0, bob);
  const bg = ctx.createLinearGradient(0, -30, 0, -13);
  bg.addColorStop(0, '#9dc0f8'); bg.addColorStop(1, '#4a74d0');
  ctx.fillStyle = bg; rr(ctx, -10, -30, 20, 17, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(200,225,255,0.5)'; ctx.lineWidth = 1; rr(ctx, -10, -30, 20, 17, 6); ctx.stroke();
  // chest emblem
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('D', 1.5, -22);
  ctx.restore();
  // belt
  ctx.fillStyle = '#2b3f78'; rr(ctx, -9.5, -15, 19, 3.5, 1.5); ctx.fill();
  ctx.restore();

  // ---- arms ----
  ctx.save(); ctx.translate(0, bob);
  if(running || airborne){
    ctx.fillStyle = '#5c88e2'; rr(ctx, -13, -27 + sw*3, 6, 12, 3); ctx.fill();
    ctx.fillStyle = '#6f97ea'; rr(ctx, 7, -27 - sw*3, 6, 12, 3); ctx.fill();
    ctx.fillStyle = '#f2f6ff';
    ctx.beginPath(); ctx.arc(-10, -14 + sw*3, 3.2, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(10, -14 - sw*3, 3.2, 0, 6.283); ctx.fill();
  } else {
    ctx.fillStyle = '#5c88e2'; rr(ctx, -13.5, -27, 6, 11, 3); ctx.fill();
    ctx.fillStyle = '#6f97ea'; rr(ctx, 8, -27, 6, 11, 3); ctx.fill();
    // phone in the right hand
    ctx.fillStyle = '#151d33'; rr(ctx, 7.5, -19, 9, 13.5, 2); ctx.fill();
    ctx.fillStyle = '#5aa7ef'; rr(ctx, 8.8, -17.8, 6.4, 11, 1.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; rr(ctx, 10, -16.2, 4, 1.3, 0.6); ctx.fill();
    rr(ctx, 10, -13.8, 4, 1.3, 0.6); ctx.fill();
  }
  ctx.restore();

  // ---- helmet ----
  ctx.save(); ctx.translate(0, bob);
  const hy = -37;
  // glass dome
  const gg = ctx.createRadialGradient(-4, hy-5, 2, 0, hy, 14);
  gg.addColorStop(0, 'rgba(230,245,255,0.42)');
  gg.addColorStop(0.7, 'rgba(150,200,255,0.20)');
  gg.addColorStop(1, 'rgba(90,140,230,0.30)');
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, hy, 13, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(215,240,255,0.8)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, hy, 13, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, hy, 10.5, -2.5, -1.5); ctx.stroke();
  // visor
  ctx.fillStyle = '#6f9bea'; rr(ctx, -8.5, hy-7, 17, 13, 5); ctx.fill();
  ctx.strokeStyle = 'rgba(220,240,255,0.75)'; ctx.lineWidth = 1.2; rr(ctx, -8.5, hy-7, 17, 13, 5); ctx.stroke();
  // eyes
  ctx.fillStyle = '#ffffff';
  ctx.save(); ctx.translate(-4.2, hy-1.5); ctx.rotate(-0.18);
  ctx.beginPath(); ctx.moveTo(-3.4, 2.6); ctx.lineTo(1.6, -2.4); ctx.lineTo(3.4, 2.6); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.translate(4.2, hy-1.5); ctx.rotate(0.18);
  ctx.beginPath(); ctx.moveTo(-1.6, -2.4); ctx.lineTo(3.4, 2.6); ctx.lineTo(-3.4, 2.6); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#243447';
  ctx.fillRect(-4.0, hy-0.6, 2.6, 2.6);
  ctx.fillRect(1.6, hy-0.6, 2.6, 2.6);
  // smile
  ctx.strokeStyle = '#1e2c40'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, hy+2.6, 3.2, 0.25, Math.PI-0.25); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

/* ============================ ENEMY DRAWING ============================ */
function drawEnemies(){
  for(const e of enemies){
    if(!e.alive) continue;
    const px = e.x - camera.x, py = e.y - camera.y;
    if(px < -80 || px > VW+80) continue;
    if(e.t === 'walker'){
      const sq = 1 + Math.sin(e.a)*0.08;
      ctx.save(); ctx.translate(px + e.w/2, py + e.h);
      ctx.scale(1/sq, sq);
      const g = ctx.createLinearGradient(0, -e.h, 0, 0);
      g.addColorStop(0, '#8ff0a4'); g.addColorStop(1, '#2f9e63');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, -e.h/2, e.w/2, e.h/2, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(20,60,40,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
      // spots
      ctx.fillStyle = 'rgba(255,255,255,0.20)';
      ctx.beginPath(); ctx.arc(-6, -8, 2.4, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -14, 1.8, 0, 6.283); ctx.fill();
      // eyes
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-4.5, -16, 4, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5, -16, 4, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#16281f';
      ctx.beginPath(); ctx.arc(-4.5 + e.vx*0.8, -16, 2, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(4.5 + e.vx*0.8, -16, 2, 0, 6.283); ctx.fill();
      // antennae
      ctx.strokeStyle = '#2f9e63'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-4, -24); ctx.quadraticCurveTo(-7, -30, -3, -32); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(4, -24); ctx.quadraticCurveTo(7, -30, 3, -32); ctx.stroke();
      ctx.fillStyle = '#c9ffd9';
      ctx.beginPath(); ctx.arc(-3, -32, 1.8, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(3, -32, 1.8, 0, 6.283); ctx.fill();
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(px + e.w/2, py + e.h/2);
      const glow = 0.5 + 0.5*Math.sin(game.t*0.12);
      // body
      const g = ctx.createLinearGradient(0, -12, 0, 12);
      g.addColorStop(0, '#cfd8ff'); g.addColorStop(0.5, '#8f7fe8'); g.addColorStop(1, '#4b3f8f');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(0, 0, e.w/2, e.h/2 - 3, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(30,20,60,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
      // dome
      ctx.fillStyle = 'rgba(170,215,255,0.75)';
      ctx.beginPath(); ctx.ellipse(0, -6, 8, 6, 0, Math.PI, 0); ctx.fill();
      // eye
      ctx.save(); ctx.shadowColor = 'rgba(255,90,110,0.95)'; ctx.shadowBlur = 12;
      ctx.fillStyle = 'rgba(255,90,110,'+(0.6+0.4*glow)+')';
      ctx.beginPath(); ctx.arc(0, -3, 3.4, 0, 6.283); ctx.fill();
      ctx.restore();
      // spinning ring
      ctx.strokeStyle = 'rgba(120,230,255,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 5, e.w/2 + 5, 5 + Math.abs(Math.sin(game.t*0.1))*3, 0, 0, 6.283);
      ctx.stroke();
      ctx.restore();
    }
  }
}

/* ============================ ORBS / GOAL / FX ============================ */
function drawOrbs(){
  for(const o of orbs){
    const px = o.x - camera.x, py = o.y - camera.y + Math.sin(game.t*0.08 + o.a)*2;
    if(px < -40 || px > VW+40) continue;
    const pulse = 0.75 + 0.25*Math.sin(game.t*0.14 + o.a);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(px, py, 0, px, py, 18*pulse);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.35, 'rgba(130,235,255,0.75)');
    g.addColorStop(1, 'rgba(60,160,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, 18*pulse, 0, 6.283); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#eafcff';
    ctx.beginPath(); ctx.arc(px, py, 4.2, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(150,240,255,'+(0.5*pulse)+')'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(px, py, 8.5*pulse, 0, 6.283); ctx.stroke();
  }
}
function drawGoal(){
  const gl = level.goal; if(!gl) return;
  const px = gl.x + 16 - camera.x, py = gl.y + 32 - camera.y;
  if(px < -160 || px > VW+160) return;
  const pulse = 0.5 + 0.5*Math.sin(game.t*0.07);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let i=3;i>=0;i--){
    const rad = 26 + i*11 + pulse*5;
    const g = ctx.createRadialGradient(px, py, 0, px, py, rad);
    g.addColorStop(0, 'rgba(190,150,255,'+(0.42 - i*0.07)+')');
    g.addColorStop(0.6, 'rgba(110,190,255,'+(0.22 - i*0.04)+')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, rad, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.translate(px, py); ctx.rotate(game.t*0.012);
  for(let i=0;i<3;i++){
    ctx.strokeStyle = 'rgba(' + (170+i*20) + ',230,255,' + (0.75-i*0.18) + ')';
    ctx.lineWidth = 3 - i*0.7;
    ctx.beginPath(); ctx.ellipse(0, 0, 20, 30, i*0.7, 0, 6.283); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(240,235,255,'+(0.55+0.4*pulse)+')';
  ctx.beginPath(); ctx.arc(px, py, 6, 0, 6.283); ctx.fill();
}
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x - camera.x, p.y - camera.y, p.r*p.life + 0.6, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px ui-monospace,monospace';
  for(const p of pops){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(p.text, p.x - camera.x + 1, p.y - camera.y + 1);
    ctx.fillStyle = p.col;
    ctx.fillText(p.text, p.x - camera.x, p.y - camera.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}
function drawShadow(){
  if(!player) return;
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.fillStyle = '#000';

  ctx.ellipse(player.x + player.w/2 - camera.x, player.y + player.h - camera.y + 3, 15, 5, 0, 0, 6.283);

/* ============================ LEADERBOARD ============================ */
const LB_KEY = 'astroDash.scores.v2';
const LB_PILOT = 'astroDash.pilot.v2';
const NAME_MAX = 8;
function dedupeScores(list){
  // the same name is the same player: keep only their highest score
  const best = new Map();
  for(const e of list){
    const cur = best.get(e.n);
    if(!cur || e.s > cur.s) best.set(e.n, e);
  }
  return Array.from(best.values()).sort((a, b) => b.s - a.s).slice(0, 10);
}
function loadScores(){
  try{
    const a = JSON.parse(localStorage.getItem(LB_KEY) || '[]');
    if(!Array.isArray(a)) return [];
    return dedupeScores(a.filter(e => e && typeof e.s === 'number' && typeof e.n === 'string'));
  }catch(err){ return []; }
}
function saveScores(list){ try{ localStorage.setItem(LB_KEY, JSON.stringify(list.slice(0, 10))); }catch(err){} }
try{ localStorage.removeItem('astroDash.scores.v1'); localStorage.removeItem('astroDash.pilot.v1'); }catch(err){}   // launch reset: drop pre-release saves
let scores = loadScores();
let pilotName = (()=>{ try{ return (localStorage.getItem(LB_PILOT) || '').slice(0, NAME_MAX); }catch(err){ return ''; } })();
function rememberPilot(n){ try{ localStorage.setItem(LB_PILOT, n); }catch(err){} }
function submitScore(name, score){
  const n = (name || 'PILOT').slice(0, NAME_MAX);
  if(!(score > 0)) return { rank:0, improved:false };
  const prev = scores.find(e => e.n === n);
  const improved = !prev || (score|0) > prev.s;
  scores = dedupeScores(scores.concat([{ n:n, s:score|0, k:(game.levelIndex + 1) }]));
  saveScores(scores);
  const i = scores.findIndex(e => e.n === n);
  return { rank: i >= 0 ? i + 1 : 0, improved: improved };
}
function finishRun(){
  if(game.submitted) return;
  game.submitted = true;
  const r = submitScore(game.name, game.score);
  game.rank = r.rank; game.improved = r.improved;
}
function confirmName(){
  const n = (pilotName || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_MAX);
  game.name = n || 'PILOT';
  rememberPilot(game.name);
  startGame();
}
let kbCells = [];
function kbHit(x, y){
  for(const c of kbCells) if(x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h) return c.k;
  return null;
}
function nameKey(k){
  if(k === 'OK') confirmName();
  else if(k === 'BACK') backToTitle();
  else if(k === 'DEL') pilotName = pilotName.slice(0, -1);
  else if(pilotName.length < NAME_MAX) pilotName += k;
}

let scoresFrom = ST.TITLE;
function openScores(from){ scoresFrom = (from === undefined ? game.state : from); game.state = ST.SCORES; }

function drawKeyboard32(){
  kbCells = [];
  const rows = ['ABCDEFGHIJ', 'KLMNOPQRST', 'UVWXYZ0123', ['4','5','6','7','8','9','BACK','DEL','OK']];
  const cw = 84, chh = 52, y0 = 246;
  for(let r = 0; r < rows.length; r++){
    const items = Array.isArray(rows[r]) ? rows[r] : rows[r].split('');
    const sx = Math.round((VW - items.length*cw)/2);
    for(let i = 0; i < items.length; i++){
      const x = sx + i*cw, y = y0 + r*(chh + 4), k = items[i];
      panel(x + 2, y + 2, cw - 4, chh - 4);
      ctx.save();
      ctx.textAlign = 'center';
      const word = k === 'DEL' || k === 'OK' || k === 'BACK';
      ctx.font = 'bold ' + (word ? 20 : 26) + 'px ui-monospace,monospace';
      ctx.fillStyle = k === 'OK' ? '#9dffb0' : ((k === 'DEL' || k === 'BACK') ? '#ffb0b0' : '#eaf4ff');
      ctx.fillText(k === 'DEL' ? '<' : k, x + cw/2, y + chh/2 + 9);
      ctx.restore();
      kbCells.push({x:x, y:y, w:cw, h:chh, k:k});
    }
  }
}

/* ============================ RENDER ============================ */
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,VW,VH);
  if(game.state === ST.TITLE){ drawTitle(); return; }
  if(game.state === ST.NAME){ drawNameEntry(); return; }
  if(game.state === ST.SCORES){ drawScores(); return; }
  if(shake > 0.4){ ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); }
  drawBackground();
  drawTiles();
  drawGoal();
  drawOrbs();
  drawEnemies();
  drawShadow();
  if(player){
    const hx = player.x + player.w/2 - camera.x, hy = player.y + player.h/2 - camera.y;
    ctx.save();
    const hg = ctx.createRadialGradient(hx, hy, 2, hx, hy, 34);
    hg.addColorStop(0, 'rgba(4,8,20,0.42)'); hg.addColorStop(1, 'rgba(4,8,20,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, hy, 34, 0, 6.283); ctx.fill();
    ctx.restore();
    const alpha = (player.inv > 0 && Math.floor(game.t/4) % 2 === 0) ? 0.35 : 1;
    const running = Math.abs(player.vx) > 0.6 && player.onGround;
    const airborne = !player.onGround;
    drawHero(ctx, player.x + player.w/2 - camera.x, player.y + player.h - camera.y,
             1, player.face, running, airborne, player.anim, alpha);
  }
  drawParts();
  drawHUD();
  if(game.state === ST.PAUSE || game.state === ST.CLEAR || game.state === ST.DEAD ||
     game.state === ST.OVER || game.state === ST.WIN) drawOverlayScreens();
}

/* ============================ LOOP ============================ */
let last = performance.now(), acc = 0;
function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  if(dt > 0.25) dt = 0.25;
  acc += dt;
  let guard = 0;
  while(acc >= 1/60 && guard++ < 6){ step(); acc -= 1/60; }
  render();
}
loadLevel(0);
game.state = ST.TITLE;
requestAnimationFrame(frame);

/* test hooks */
window.__astro = {
  get scores(){ return scores; }, get pilotName(){ return pilotName; }, get state(){return game.state;}, get game(){return game;},
  get level(){return level;}, get player(){return player;}, get enemies(){return enemies;},
  get orbs(){return orbs;}, get camera(){return camera;}, ST, keys, startGame, advance,
  goto(i){ loadLevel(i); game.levelIndex = i; game.state = ST.PLAY; },
  press(k){ unlockAudio(); keys[k] = true; if(k === 'jump') jumpEdge = true; },
  release(k){ keys[k] = false; },
  warp(x, y){ player.x = x; player.y = y; player.vx = 0; player.vy = 0;
              camera.x = clamp(player.x + player.w/2 - VW/2, 0, level.w*TILE - VW); },
  heroSheet(){ const c = document.createElement('canvas'); c.width = 1100; c.height = 300;
    const g = c.getContext('2d');
    const bg = g.createLinearGradient(0,0,0,300); bg.addColorStop(0,'#101b38'); bg.addColorStop(1,'#05070f');
    g.fillStyle = bg; g.fillRect(0,0,1100,300);
    drawHero(g, 120, 250, 5, 1, false, false, 12, 1);
    drawHero(g, 380, 250, 5, -1, true, false, 40, 1);
    drawHero(g, 640, 250, 5, 1, false, true, 60, 1);
    drawHero(g, 900, 250, 5, -1, false, true, 5, 1);
    return c.toDataURL('image/png'); } };
</script>
